notification:
  DomainClaimed:
    ButtonText__MISSING: Login
    Greeting: Hello {{.DisplayName}},
    PreHeader: Change email / username
    Subject__MISSING: Domain has been claimed
    Text: The domain {{.Domain}} has been claimed by an organization. Your current user {{.Username}} is not part of this organization. Therefore you'll have to change your email when you login. We have created a temporary username ({{.TempUsername}}) for this login.
    Title__CONFLICT: Domain claimed | Domain has been claimed
  InitCode:
    ButtonText: Finish initialization
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader__CONFLICT: Initialize User | Initialize user
    Subject__MISSING: Initialize User
    Text: This user was created. Use the username {{.PreferredLoginName}} to login. Please click the button below to finish the initialization process. (Code {{.Code}}) If you didn't ask for this mail, please ignore it.
    Title__MISSING: Initialize User
  InviteUser:
    ButtonText: Accept invite
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader: Invitation to {{.ApplicationName}}
    Subject__MISSING: Invitation to {{.ApplicationName}}
    Text: Your user has been invited to {{.ApplicationName}}. Please click the button below to finish the invite process. If you didn't ask for this mail, please ignore it.
    Title__MISSING: Invitation to {{.ApplicationName}}
  PasswordChange:
    ButtonText__MISSING: Login
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader__MISSING: Change password
    Subject__MISSING: Password of user has changed
    Text: The password of your user has changed. If this change was not done by you, please be advised to immediately reset your password.
    Title: Password of user has changed
  PasswordReset:
    ButtonText__MISSING: Reset password
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader__MISSING: Reset password
    Subject__MISSING: Reset password
    Text: We received a password reset request. Please use the button below to reset your password. (Code {{.Code}}) If you didn't ask for this mail, please ignore it.
    Title__MISSING: Reset password
  PasswordlessRegistration:
    ButtonText__MISSING: Add Passkey Login
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader: Add Passkey Login
    Subject__MISSING: Add Passkey Login
    Text: We received a request to add a token for passkey login. Please use the button below to add your token or device for passkey login.
    Title__MISSING: Add Passkey Login
  VerifyEmail:
    ButtonText__MISSING: Verify email
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader__CONFLICT: E-Mail Verification | Email verification | Verify Email | Verify email
    Subject__MISSING: Verify email
    Text: A new email has been added. Please use the button below to verify your email. (Code {{.Code}}) If you didn't add a new email, please ignore this email.
    Title__MISSING: Verify email
  VerifyEmailOTP:
    ButtonText__MISSING: Authenticate
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader: Verify OTP
    Subject__MISSING: Verify OTP
    Text: Please use the OTP {{.OTP}} to authenticate within the next five minutes or click the "Authenticate" button.
    Title__MISSING: Verify OTP
  VerifyPhone:
    ButtonText__MISSING: Verify phone
    Greeting__MISSING: Hello {{.DisplayName}},
    PreHeader__CONFLICT: Phone verification | Verify Phone | Verify Phone Number | Verify phone
