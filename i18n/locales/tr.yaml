          SELECT_EVENT:
            DESCRIPTION: Yalnızca belirli bir olayda yürütmek istiyorsanız, burada belirtin
            TITLE: Olay Seç
          SELECT_GROUP:
            DESCRIPTION: Yalnızca bir olay grubunda yürütmek istiyorsanız, grubu buraya ayarlayın
