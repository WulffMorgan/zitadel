        LABEL_DAYS: Gün Cinsinden Maksimum Yaşam Süresi
        LABEL_HOURS: Saat Cinsinden Maksimum Yaşam Süresi
        REFRESH_TOKEN:
          DESCRIPTION: Refresh token, yeni bir access token elde etmek için kullanılır. Access token'ı yenilemek için kullanılan uzun ömürlü bir token'dır. Refresh token süresi dolduğunda kullanıcının manuel olarak yeniden kimlik doğrulaması yapması gerekir.
          TITLE__MISSING: Refresh Token
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: Boşta refresh token yaşam süresi, bir refresh token'ın kullanılmadan kalabileceği maksimum süredir.
