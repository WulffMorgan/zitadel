    METADATA_TITLE: Meta Veri
    ORG:
      DESCRIPTION: Bir organizasyon kullanıcıları, uygulamalı projeleri, kimlik sağlayıcıları ve şirket markalaması gibi ayarları barındırır. Ayarları birden fazla organizasyon arasında paylaşmak ister misiniz? Varsayılan ayarları yapılandırın.
      METADATA: Organizasyona konum veya başka bir sistemdeki tanımlayıcı gibi özel öznitelikler ekleyin. Bu bilgileri eylemlerinizde kullanabilirsiniz.
      TITLE: Organizasyon
    PROJECTS:
      DESCRIPTION: Bir proje, kullanıcılarınızı doğrulamak için kullanabileceğiniz bir veya daha fazla uygulamayı barındırır. Örneğin, web ön ucunuz, mobil uygulamanız ve arka ucunuz için birer tane olmak üzere 3 uygulamalı tek bir projeniz olabilir. Ayrıca kullanıcılarınızı projelerle yetkilendirebilirsiniz. Diğer organizasyonlardan kullanıcıların uygulamalarınıza giriş yapmasına izin vermek için onlara projenize erişim izni verin.<br/><br/>Bir proje bulamazsanız, proje sahibiyle veya ilgili haklara sahip biriyle iletişime geçerek erişim sağlayın.
      GRANTED:
        DESCRIPTION: Bunlar diğer organizasyonların size verdiği projelerdir. Verilen projelerle kullanıcılarınıza diğer organizasyonların uygulamalarına erişim sağlayabilirsiniz.
        TITLE: Verilen Projeler
      OWNED:
        DESCRIPTION: Bunlar sizin sahip olduğunuz projeler. Ayarlarını, rol atamalarını ve uygulamalarını yönetebilirsiniz.
        TITLE: Sahip Olunan Projeler
      TITLE: Projeler
    ROLE_ASSIGNMENTS:
      DESCRIPTION: Rol atamaları, kullanıcıların proje erişim izinlerini tanımlar. Kullanıcılara projelere erişim izni verebilir ve bu projelerdeki rollerini tanımlayabilirsiniz.
      TITLE: Rol Atamaları
    SETTINGS:
      BRANDING:
        DESCRIPTION: Giriş formunuzun görünümünü ve hissini özelleştirin. İşiniz bittiğinde yapılandırmanızı uygulamayı unutmayın.
        TITLE: Markalama
      DOMAINS:
        DESCRIPTION: Alan adlarınızda kısıtlamalar tanımlayın ve giriş adı desenlerinizi yapılandırın.
        DOMAIN_VERIFICATION:
          DESCRIPTION: Yalnızca organizasyonunuzun gerçekten kontrol ettiği alan adlarını kullanmasına izin verin. Etkinleştirilirse, organizasyon alan adları kullanılmadan önce DNS veya HTTP challenge ile periyodik olarak doğrulanır. Bu, alan adı ele geçirilmesini önlemek için bir güvenlik özelliğidir.
          TITLE: Alan Adı Doğrulama
        LOGIN_NAME_PATTERN:
          DESCRIPTION: Kullanıcılarınızın giriş adlarının desenini kontrol edin. Zitadel, kullanıcılarınız giriş adlarını girer girmez organizasyonlarını seçer. Bu nedenle giriş adlarının tüm organizasyonlar arasında benzersiz olması gerekir. Birden fazla alan adında hesabı olan kullanıcılarınız varsa, giriş adlarınızı organizasyon alan adıyla soneklendirerek benzersizliği sağlayabilirsiniz.
          TITLE: Giriş Adı Deseni
        REQUIRE_VERIFICATION:
          DESCRIPTION: Bu etkinleştirilirse, organizasyon alan adları alan adı keşfi veya kullanıcı adı soneki için kullanılmadan önce doğrulanmalıdır.
          TITLE: Özel alan adlarının doğrulanmasını gerektir
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: Yalnızca örnek alan adlarınızdan biriyle eşleşiyorsa bir SMTP gönderen adresine izin verin.
          TITLE: SMTP Gönderen Adresi
        TITLE: Alan Adı Ayarları
      FEATURES:
        DESCRIPTION: Örneğiniz için özelliklerin kilidini açın.
        TITLE: Özellik Ayarları
      IAM_EVENTS:
        DESCRIPTION: Bu sayfa, örneğinizin denetim izi sınırına kadar geri giden tüm durum değişikliklerini gösterir. Hata ayıklama amacıyla listeyi zaman aralığına göre filtreleyin veya denetleme amacıyla bir agrega ile filtreleyin.
        TITLE: Olaylar
      IAM_FAILED_EVENTS:
        DESCRIPTION: Bu sayfa, örneğinizdeki tüm başarısız olayları gösterir. Zitadel beklediğiniz gibi davranmıyorsa, her zaman önce bu listeyi kontrol edin.
        TITLE: Başarısız Olaylar
      IAM_VIEWS:
        DESCRIPTION: Bu sayfa tüm veritabanı görünümlerinizi ve en son olaylarını ne zaman işlediklerini gösterir. Bazı verileri kaçırıyorsanız, görünümün güncel olup olmadığını kontrol edin.
        TITLE: Görünümler
      IDPS:
        ACTIVATE:
          DESCRIPTION: IdP'niz henüz aktif değil. Kullanıcılarınızın giriş yapmasına izin vermek için etkinleştirin.
          TITLE: IdP'yi Etkinleştir
        AUTOFILL:
          DESCRIPTION: Kullanıcılarınızın deneyimini iyileştirmek için bir eylem kullanın. Zitadel kayıt formunu kimlik sağlayıcısından gelen değerlerle önceden doldurabilirsiniz.
          TITLE: Kullanıcı Verilerini Otomatik Doldur
        CALLBACK:
          DESCRIPTION: Zitadel'i yapılandırabilmeniz için önce bu URL'yi Kimlik Sağlayıcınıza ileterek kimlik doğrulamasından sonra tarayıcının Zitadel'e geri yönlendirilmesini etkinleştirin.
          TITLE: '{{ provider }} Kimlik Sağlayıcınızı Yapılandırın'
        DESCRIPTION: Harici kimlik sağlayıcıları oluşturun ve etkinleştirin. Tanınmış bir sağlayıcı seçin veya tercih ettiğiniz herhangi bir OIDC, OAuth veya SAML uyumlu sağlayıcıyı yapılandırın. Bir JWT kimlik sağlayıcısı yapılandırarak mevcut JWT belirteçlerinizi federe kimlikler olarak bile kullanabilirsiniz.
        JWT:
          DESCRIPTION: JWT Kimlik Sağlayıcısı, mevcut JWT belirteçlerinizi federe kimlikler olarak kullanmanızı sağlar. Bu özellik, zaten JWT'ler için bir verici/issuer'ınız varsa kullanışlıdır. Bir JWT IdP ile, bu JWT'leri Zitadel'de anında kullanıcı oluşturmak ve güncellemek için kullanabilirsiniz.
          TITLE: JWT'leri Federe Kimlikler Olarak Kullanın
        LDAP:
          DESCRIPTION: LDAP sunucunuza bağlantı ayrıntılarını sağlayın ve LDAP özniteliklerinizin Zitadel özniteliklerine eşlenmesini yapılandırın.
          TITLE: Zitadel'i LDAP Kimlik Sağlayıcınıza Bağlanacak Şekilde Yapılandırın
        NEXT: Şimdi ne yapmalı?
        SAML:
          DESCRIPTION: Zitadel yapılandırıldı. Şimdi SAML Kimlik Sağlayıcınızın bazı yapılandırmalara ihtiyacı var. Çoğu sağlayıcı, tüm Zitadel metadata XML'ini yüklemenize izin verir. Diğer sağlayıcılar yalnızca belirli URL'ler sağlamanızı ister, örneğin entity ID (metadata URL), Assertion Consumer Service (ACS) URL veya Single Logout URL.
          TITLE: SAML Kimlik Sağlayıcınızı Yapılandırın
        TITLE: Kimlik Sağlayıcıları
      INSTANCE:
        DESCRIPTION: Tüm organizasyonlar için varsayılan ayarlar. Uygun izinlerle, bunların bazıları organizasyon ayarlarında geçersiz kılınabilir.
        TITLE: Varsayılan Ayarlar
      LANGUAGES:
        DESCRIPTION: Giriş formunun ve bildirim mesajlarının çevrildiği dilleri kısıtlayın. Bazı dilleri devre dışı bırakmak istiyorsanız, bunları İzin Verilmeyen Diller bölümüne sürükleyin. İzin verilen bir dili varsayılan dil olarak belirleyebilirsiniz. Kullanıcının tercih ettiği dile izin verilmiyorsa, varsayılan dil kullanılır.
        TITLE: Diller
      LOGIN:
        FORM:
          DESCRIPTION: Giriş formunu özelleştirin.
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: Bu etkinleştirilirse, kullanıcılarınız giriş yapmak için e-posta adreslerini kullanamaz. Bunu devre dışı bırakırsanız, giriş yapabilmek için kullanıcılarınızın e-posta adreslerinin tüm organizasyonlar arasında benzersiz olması gerektiğini unutmayın.
            TITLE: E-posta Girişini Devre Dışı Bırak
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: Bu etkinleştirilirse, kullanıcılarınız giriş yapmak için telefon numaralarını kullanamaz. Bunu devre dışı bırakırsanız, giriş yapabilmek için kullanıcılarınızın telefon numaralarının tüm organizasyonlar arasında benzersiz olması gerektiğini unutmayın.
            TITLE: Telefon Girişini Devre Dışı Bırak
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: Kullanıcılarınızın giriş adlarının alan adına bağlı olarak organizasyonlarını bulun, örneğin e-posta adresleri.
            TITLE: Alan Adı Keşfine izin verildi
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: Kullanıcılarınızın giriş yapmak için Zitadel kullanıcısını kullanmak yerine harici kimlik sağlayıcısıyla giriş yapmalarına izin verin.
            TITLE: Harici Girişe izin verildi
          HIDE_PASSWORD_RESET:
            DESCRIPTION: Kullanıcılarınızın şifrelerini sıfırlamalarına izin vermeyin.
            TITLE: Şifre Sıfırlama gizlendi
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: Bu etkinleştirilirse, giriş formu kullanıcı adı bilinmiyorsa hata mesajı göstermez. Bu, kullanıcı adı tahmin etmeyi önlemeye yardımcı olur.
            TITLE: Bilinmeyen Kullanıcı Adlarını yoksay
          LOCAL_AUTHENTICATION_ALLOWED:
            DESCRIPTION: Kullanıcılarınızın kullanıcı adı ve şifre veya geçiş anahtarı (passkey) kimlik doğrulaması ile oturum açmasına izin verin. Bu devre dışı bırakılırsa, kullanıcılarınız yalnızca harici bir kimlik sağlayıcı kullanarak oturum açabilir.
            TITLE: Yerel kimlik doğrulamaya izin verildi
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: Anonim kullanıcıların organizasyon oluşturmasına izin verin.
            TITLE: Organizasyon Kaydına izin verildi
          TITLE: Giriş Formu
          USER_REGISTRATION_ALLOWED:
            DESCRIPTION: Anonim kullanıcıların hesap oluşturmasına izin verin.
            TITLE: Kullanıcı Kaydına izin verildi
        LIFETIMES:
          DESCRIPTION: Bazı giriş ile ilgili maksimum yaşam sürelerini azaltarak güvenliğinizi sağlamlaştırın.
          EXT_LOGIN_CHECK:
            DESCRIPTION: Kullanıcılarınız bu süre sonra harici kimlik sağlayıcılarına yönlendirilir.
            TITLE: Harici Giriş Kontrolü
          LABEL: Saat Cinsinden Maksimum Yaşam Süresi
          MULTI_FACTOR_CHECK:
            DESCRIPTION: Kullanıcılarınız bu sürelerde Çoklu faktörlerini yeniden doğrulamak zorundadır.
            TITLE: Çoklu Faktör Kontrolü
          MULTI_FACTOR_INIT:
            DESCRIPTION: Kullanıcılarınız henüz yapmadılarsa bu süre sonra ikinci bir faktör veya Çoklu faktör kurmaları için uyarılacaktır. 0 yaşam süresi bu uyarıyı devre dışı bırakır.
            TITLE: Çoklu Faktör Başlatma Kontrolü
          PW_CHECK:
            DESCRIPTION: Kullanıcılar bu süre sonra şifreleriyle yeniden kimlik doğrulaması yapmak zorunda kalacaklardır.
            TITLE: Şifre Kontrolü
          SECOND_FACTOR_CHECK:
            DESCRIPTION: Kullanıcılarınız bu sürelerde ikinci faktörlerini yeniden doğrulamak zorundadır.
            TITLE: İkinci Faktör Kontrolü
          TITLE: Giriş Yaşam Süreleri
      LOGIN_TEXTS:
        DESCRIPTION: Giriş formunuzun metinlerini özelleştirin. Bir metin boşsa, yer tutucu varsayılan değeri gösterir. Bazı dilleri devre dışı bırakmak istiyorsanız, bunları örnek dil ayarlarınızda kısıtlayın.
        TITLE: Giriş Arayüzü Metinleri
      MESSAGE_TEXTS:
        DESCRIPTION: Bildirim e-postası veya SMS mesajlarınızın metinlerini özelleştirin. Bazı dilleri devre dışı bırakmak istiyorsanız, bunları örnek dil ayarlarınızda kısıtlayın.
        TITLE: Mesaj Metinleri
        TYPE_DESCRIPTIONS:
          DC: Organizasyonunuz için bir alan adı talep ettiğinizde, giriş adlarında bu alan adını kullanmayan kullanıcılar, giriş adlarını talep edilen alan adıyla eşleşecek şekilde değiştirmeleri için uyarılacaktır.
          INIT: Bir kullanıcı oluşturulduğunda, şifrelerini belirlemek için bir bağlantı içeren bir e-posta alacaklardır.
          IU: Bir kullanıcı davet kodu oluşturulduğunda, kimlik doğrulama yöntemlerini belirlemek için bir bağlantı içeren bir e-posta alacaklardır.
          PC: Bir kullanıcı şifresini değiştirdiğinde, bildirim ayarlarında bunu etkinleştirdiyseniz değişiklik hakkında bir bildirim alacaklardır.
          PL: Bir kullanıcı şifresiz kimlik doğrulama yöntemi eklediğinde, bir e-postadaki bağlantıyı tıklayarak etkinleştirmeleri gerekir.
          PR: Bir kullanıcı şifresini sıfırladığında, yeni bir şifre belirlemek için bir bağlantı içeren bir e-posta alacaktır.
          VE: Bir kullanıcı e-posta adresini değiştirdiğinde, yeni adresi doğrulamak için bir bağlantı içeren bir e-posta alacaktır.
          VEO: Bir kullanıcı e-posta yoluyla OTP yöntemi eklediğinde, e-posta adreslerine gönderilen bir kodu girerek etkinleştirmeleri gerekir.
          VP: Bir kullanıcı telefon numarasını değiştirdiğinde, yeni numarayı doğrulamak için bir kod içeren bir SMS alacaktır.
          VSO: Bir kullanıcı SMS yoluyla OTP yöntemi eklediğinde, telefon numaralarına gönderilen bir kodu girerek etkinleştirmeleri gerekir.
      OIDC:
        ACCESS_TOKEN:
          DESCRIPTION: Access token, bir kullanıcının kimlik doğrulaması için kullanılır. Kullanıcının verilerine erişmek için kullanılan kısa ömürlü bir token'dır. Yetkisiz erişim riskini en aza indirmek için kısa bir yaşam süresi kullanın. Access token'lar, refresh token kullanılarak otomatik olarak yenilenebilir.
          TITLE: Access Token
        DESCRIPTION: OIDC belirteç yaşam sürelerinizi yapılandırın. Kullanıcılarınızın güvenliğini artırmak için daha kısa yaşam süreleri, kullanıcılarınızın rahatlığını artırmak için daha uzun yaşam süreleri kullanın.
        ID_TOKEN:
          DESCRIPTION: ID token, kullanıcı hakkında talepleri içeren bir JSON Web Token (JWT)'dir. ID token yaşam süresi, access token yaşam süresini aşmamalıdır.
          TITLE: ID Token
        LABEL_DAYS: Gün Cinsinden Maksimum Yaşam Süresi
        LABEL_HOURS: Saat Cinsinden Maksimum Yaşam Süresi
        REFRESH_TOKEN:
          DESCRIPTION: Refresh token, yeni bir access token elde etmek için kullanılır. Access token'ı yenilemek için kullanılan uzun ömürlü bir token'dır. Refresh token süresi dolduğunda kullanıcının manuel olarak yeniden kimlik doğrulaması yapması gerekir.
          TITLE: Refresh Token
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: Boşta refresh token yaşam süresi, bir refresh token'ın kullanılmadan kalabileceği maksimum süredir.
          TITLE: Boşta Refresh Token
        TITLE: OpenID Connect Ayarları
      ORG:
        DESCRIPTION: Organizasyonunuzun ayarlarını özelleştirin.
        TITLE: Organizasyon Ayarları
      PRIVACY_POLICY:
        DESCRIPTION: Kullanıcılarınızı giriş sayfasında gösterilen özel harici kaynaklara yönlendirin. Kullanıcıların kaydolabilmeleri için Hizmet Şartları ve Gizlilik Politikasını kabul etmeleri gerekir. Belgelerinize olan bağlantıyı değiştirin veya belgeler düğmesini yönetim konsolundan gizlemek için boş bir dize ayarlayın. Yönetim konsolunda özel bir harici bağlantı ve o bağlantı için özel bir metin ekleyin, veya bu düğmeyi gizlemek için boş bırakın.
        TITLE: Harici Bağlantılar
      PW_COMPLEXITY:
        DESCRIPTION: Karmaşıklık kuralları tanımlayarak kullanıcılarınızın güçlü şifreler kullanmasını sağlayın.
        TITLE: Şifre Karmaşıklığı
      SECRET_GENERATORS:
        DESCRIPTION: Gizlilerinizin karmaşıklığını ve ömrünü tanımlayın. Daha yüksek karmaşıklık ve ömür güvenliği artırır, daha düşük karmaşıklık ve ömür şifre çözme performansını iyileştirir.
        TITLE: Gizli Üreticiler
      SECURITY:
        DESCRIPTION: Güvenlik etkisi olabilecek Zitadel özelliklerini etkinleştirin. Bu ayarları değiştirmeden önce ne yaptığınızı gerçekten bilmelisiniz.
        TITLE: Güvenlik Ayarları
      SMS_PROVIDER:
        DESCRIPTION: Tüm Zitadel özelliklerinin kilidini açmak için kullanıcılarınıza SMS mesajları göndermek üzere Twilio'yu yapılandırın.
        TITLE: SMS Ayarları
      SMTP_PROVIDER:
        DESCRIPTION: Kullanıcılarınızın tanıdığı ve güvendiği bir alan adını gönderen adresi için kullanmak üzere SMTP sunucunuzu yapılandırın.
        TITLE: SMTP Ayarları
      WEB_KEYS:
        CREATE:
          BITS: Bit
          CURVE: Eğri
          DESCRIPTION: Yeni bir web anahtarı oluşturmak bunu listenize ekler. Zitadel varsayılan olarak SHA256 hasher ile RSA2048 anahtarları kullanır.
          HASHER: Hasher
          KEY_TYPE: Anahtar Türü
          TITLE: Yeni Web Anahtarı Oluştur
        DESCRIPTION: Zitadel örneğiniz için token'ları güvenli bir şekilde imzalamak ve doğrulamak için OIDC Web Anahtarlarınızı yönetin.
        PREVIOUS_TABLE:
          DEACTIVATED_ON: Devre dışı bırakıldığı tarih
          DESCRIPTION: Bunlar artık aktif olmayan önceki web anahtarlarınızdır.
          TITLE: Önceki Web Anahtarları
        TABLE:
          ACTIVATE: Sonraki Web Anahtarını Etkinleştir
          ACTIVE: Şu anda aktif
          DESCRIPTION: Aktif ve yaklaşan web anahtarlarınız. Yeni bir anahtar etkinleştirmek mevcut olanı devre dışı bırakacaktır.
          FUTURE: Gelecek
          NEXT: Sırada
          NOTE: 'Not: JWKs OIDC endpoint önbelleğe alınabilir bir yanıt döndürür (varsayılan 5 dk). Henüz önbelleklerde ve uygulamalarda mevcut olmayabileceği için bir anahtarı çok erken etkinleştirmekten kaçının.'
          TITLE: Aktif ve Gelecek Web Anahtarları
          WARNING: Web Anahtarı 5 dakikadan daha yeni
    USERS:
      DESCRIPTION: Kullanıcı, uygulamalarınıza erişebilen bir insan veya hizmet hesabıdır.
