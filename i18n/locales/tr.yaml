      DESCRIPTION: Eylemler, API isteklerine, olaylara veya belirli işlevlere yanıt olarak özel kod çalıştırmanıza olanak tanır. Zitadel'i genişletmek, iş akışlarını otomatikleştirmek ve diğer sistemlerle entegre olmak için bunları kullanın.
      DIALOG:
        CONDITION:
          ALL:
            DESCRIPTION: Eyleminizi her istekte çalıştırmak istiyorsanız bunu seçin
            TITLE: Tümü
          ALL_EVENTS: Eyleminizi her olayda çalıştırmak istiyorsanız bunu seçin
