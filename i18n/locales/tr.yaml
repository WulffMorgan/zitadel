            DESCRIPTION: Bu etkinleştirilirse, kullanıcılarınız giriş yapmak için e-posta adreslerini kullanamaz. Bunu devre dışı bırakırsanız, giriş yapabilmek için kullanıcılarınızın e-posta adreslerinin tüm organizasyonlar arasında benzersiz olması gerektiğini unutmayın.
