    HOME:
      MORE_SHORTCUTS:
        DOCS:
          DESCRIPTION: 探索Zitadel的知识库，熟悉核心概念和思想。学习Zitadel的工作原理和如何使用它。
          TITLE: 文档
        EXAMPLES:
          DESCRIPTION: 浏览我们的示例和SDK，以你喜欢的编程语言和工具一起使用Zitadel。
          TITLE: 示例和软件开发工具包
        GET_STARTED:
          DESCRIPTION: 跟随快速启动指南一步一步开始构建。
          TITLE: 开始
      NEXT:
        CREATE_PROJECT:
          DESCRIPTION: 添加项目并定义角色及角色分配。
          TITLE: 创建项目
        DESCRIPTION: 完成以下步骤来保护你的应用程序。
        TITLE: 你的下一步
      TITLE: 开始使用Zitadel
    METADATA_TITLE: 元数据
    ORG:
      DESCRIPTION: 一个组织托管用户、带有应用的项目、身份提供者和设置，如公司品牌。你想跨多个组织共享设置吗？配置默认设置。
      METADATA: 为组织添加自定义属性，如其位置或在其他系统中的标识符。你可以在你的行动中使用这些信息。
      TITLE: 组织
    PROJECTS:
      DESCRIPTION: 一个项目托管一个或多个应用，你可以用它们来验证你的用户。例如，你可能有一个包含3个应用的项目；一个用于你的Web前端，一个用于你的移动应用，一个用于你的后端。你还可以通过项目对用户进行授权。为了允许其他组织的用户登录到你的应用，给予他们访问你的项目的权限。<br/><br/>如果你找不到一个项目，请联系项目所有者或拥有相应权利的人以获得访问权限。
      GRANTED:
        DESCRIPTION: 这些是其他组织授予你的项目。通过授予的项目，你可以让你的用户访问其他组织的应用。
        TITLE: 授予的项目
      OWNED:
        DESCRIPTION: 这些是您拥有的项目。您可以管理其设置、角色分配和应用程序。
        TITLE: 所拥有的项目
      TITLE: 项目
    ROLE_ASSIGNMENTS:
      DESCRIPTION: 角色分配定义用户对项目的访问权限。您可以授予用户访问项目的权限，并定义他们在项目中的角色。
      TITLE: 角色分配
    SETTINGS:
      BRANDING:
        DESCRIPTION: 自定义登录表单的外观和感觉。完成时记得应用您的配置。
        TITLE: 品牌
      DOMAINS:
        DESCRIPTION: 定义您的域上的限制并配置您的登录名模式。Zitadel在用户输入其登录名时立即选择用户的组织。因此，登录名需要跨所有组织唯一。如果您有在多个域中拥有账户的用户，您可以通过在登录名后加上组织域来确保唯一性。
        DOMAIN_VERIFICATION:
          DESCRIPTION: 仅允许您的组织使用它们实际控制的域。如果启用，组织域将定期通过DNS或HTTP挑战进行验证，然后才能使用。这是一项安全功能，用于防止域名劫持。
          TITLE: 域验证
        LOGIN_NAME_PATTERN:
          DESCRIPTION: 控制您用户的登录名模式。
          TITLE: 登录名模式
        REQUIRE_VERIFICATION:
          DESCRIPTION: 如果启用此功能，组织域必须在它们可以用于域发现或用户名后缀之前进行验证。
          TITLE: 需要验证自定义域
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: 仅当SMTP发件人地址匹配您的实例域之一时允许它。
          TITLE: SMTP发件人地址
        TITLE: 域设置
      FEATURES:
        DESCRIPTION: 解锁您的实例的功能。
        TITLE: 功能设置
      IAM_EVENTS:
        DESCRIPTION: 此页面显示您实例中的所有状态更改，直到您实例的审计跟踪限制为止。出于调试目的按时间范围过滤列表，或出于审计目的按汇总过滤列表。
        TITLE: 事件
      IAM_FAILED_EVENTS:
        DESCRIPTION: 此页面显示您实例中的所有失败事件。如果Zitadel的行为不符合您的预期，请始终首先检查此列表。
        TITLE: 失败的事件
      IAM_VIEWS:
        DESCRIPTION: 此页面显示您所有数据库视图以及它们处理最新事件的时间。如果您缺少某些数据，请检查视图是否是最新的。
        TITLE: 视图
      IDPS:
        ACTIVATE:
          DESCRIPTION: 你的IdP尚未激活。激活它，以允许你的用户登录。
          TITLE: 激活IdP
        AUTOFILL:
          DESCRIPTION: 使用一个操作来改善用户体验。你可以使用身份提供者的值预填充Zitadel的注册表单。
          TITLE: 自动填充用户数据
        CALLBACK:
          DESCRIPTION: 在你能配置Zitadel之前，将这个URL传递给你的身份提供者，以便在认证后启用浏览器重定向回到Zitadel。
          TITLE: 配置你的{{ provider }}身份提供者
        DESCRIPTION: 创建并激活外部身份提供者。选择一个知名提供者或根据您的选择配置任何其他兼容OIDC、OAuth或SAML的提供者。您甚至可以通过配置JWT身份提供者，使用您现有的JWT令牌作为联合身份。
        JWT:
          DESCRIPTION: JWT身份提供者使你能够将现有的JWT令牌用作联合身份。如果你已经有一个JWT发行者，这个功能非常有用。使用JWT IdP，你可以利用这些JWT即时创建和更新Zitadel中的用户。
          TITLE: 将JWT用作联合身份
        LDAP:
          DESCRIPTION: 提供你的LDAP服务器的连接细节，并配置你的LDAP属性到Zitadel属性的映射。
          TITLE: 配置Zitadel以连接到你的LDAP身份提供者
        NEXT: 下一步？
        SAML:
          DESCRIPTION: Zitadel已配置。现在需要配置你的SAML身份提供者。大多数提供者允许你直接上传整个Zitadel元数据XML。其他提供者可能仅要求你提供一些特定的URL，例如实体ID（元数据URL）、断言消费服务（ACS）URL或单点登出URL。
          TITLE: 配置你的SAML身份提供者
        TITLE: 身份提供者
      INSTANCE:
        DESCRIPTION: 所有组织的默认设置。有了正确的权限，其中一些权限在组织设置中是可以覆盖的。
        TITLE: 默认设置
      LANGUAGES:
        DESCRIPTION: 限制登录表单和通知消息翻译到的语言。如果您想禁用某些语言，请将它们拖到不允许的语言部分。您可以指定一个允许的语言作为默认语言。如果用户偏好的语言不被允许，将使用默认语言。
        TITLE: 语言
      LOGIN:
        FORM:
          DESCRIPTION: 自定义登录表单。
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: 如果此功能被激活，你的用户不能使用他们的电子邮件地址登录。注意，如果你禁用此功能，你的用户的电子邮件地址必须在所有组织中唯一，以便登录。
            TITLE: 禁用电子邮件登录
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: 如果此功能被激活，你的用户不能使用他们的电话号码登录。注意，如果你禁用此功能，你的用户的电话号码必须在所有组织中唯一，以便登录。
            TITLE: 禁用电话登录
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: 根据用户登录名的域名找到用户的组织，例如他们的电子邮件地址。
            TITLE: 允许域名发现
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: 允许用户使用外部身份提供者登录，而不是使用Zitadel用户登录。
            TITLE: 允许外部登录
          HIDE_PASSWORD_RESET:
            DESCRIPTION: 不允许用户重置密码。
            TITLE: 隐藏密码重置
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: 如果此功能被激活，登录表单将不会显示错误消息，如果用户名未知。这有助于防止用户名猜测。
            TITLE: 忽略未知的用户名
          LOCAL_AUTHENTICATION_ALLOWED:
            DESCRIPTION: 允许您的用户使用其用户名和密码或通行密钥身份验证登录。如果停用此选项，您的用户只能使用外部身份提供商登录。
            TITLE: 允许本地身份验证
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: 允许匿名用户创建组织。
            TITLE: 允许组织注册
          TITLE: 登录表单
          USER_REGISTRATION_ALLOWED:
            DESCRIPTION: 允许匿名用户创建账户。
            TITLE: 允许用户注册
        LIFETIMES:
          DESCRIPTION: 通过减少一些与登录相关的最大有效期来加强您的安全性。
          EXT_LOGIN_CHECK:
            DESCRIPTION: 您的用户将在这些时期内被重定向到他们的外部身份提供者。
            TITLE: 外部登录检查
          LABEL: 最大有效期（小时）
          MULTI_FACTOR_CHECK:
            DESCRIPTION: 您的用户必须在这些时期内重新验证他们的多因素认证。
            TITLE: 多因素检查
          MULTI_FACTOR_INIT:
            DESCRIPTION: 如果您的用户还没有这样做，他们将在这些时期内被提示设置第二因素或多因素认证。有效期为0将停用此提示。
            TITLE: 多因素初始化检查
          PW_CHECK:
            DESCRIPTION: 此期间后，用户将需要使用密码重新验证。
            TITLE: 密码检查
          SECOND_FACTOR_CHECK:
            DESCRIPTION: 您的用户必须在这些时期内重新验证他们的第二因素。
            TITLE: 第二因素检查
          TITLE: 登录有效期
      LOGIN_TEXTS:
        DESCRIPTION: 自定义您的登录表单的文本。如果文本为空，则占位符显示默认值。如果您想禁用某些语言，请在您的实例语言设置中限制它们。
        TITLE: 登录界面文本
      MESSAGE_TEXTS:
        DESCRIPTION: 自定义您的通知电子邮件或短信消息的文本。如果您想禁用某些语言，请在您的实例语言设置中限制它们。
        TITLE: 消息文本
        TYPE_DESCRIPTIONS:
          DC: 当您为您的组织声明一个域时，那些在其登录名中未使用此域的用户将被提示更改其登录名以匹配声明的域。
          INIT: 当创建用户时，他们将收到一封带有设置密码链接的电子邮件。
          IU: 当创建用户邀请代码时，他们将收到一封包含设置其身份验证方法的链接的电子邮件。
          PC: 当用户更改其密码时，如果您在通知设置中启用了此功能，他们将收到有关更改的通知。
          PL: 当用户添加Passkey认证方法时，他们需要通过点击电子邮件中的链接来激活它。
          PR: 当用户重置其密码时，他们将收到一封带有设置新密码链接的电子邮件。
          VE: 当用户更改其电子邮件地址时，他们将收到一封带有验证新地址链接的电子邮件。
          VEO: 当用户通过电子邮件方式添加 OTP 时，他们需要通过输入发送到其电子邮件地址的代码来激活它。
          VP: 当用户更改其电话号码时，他们将收到一条带有验证新号码的代码的短信。
