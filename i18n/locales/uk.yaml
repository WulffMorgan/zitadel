    HOME:
      MORE_SHORTCUTS:
        DOCS:
          DESCRIPTION: Вивчіть базу знань Zitadel, щоб ознайомитися з основними концепціями та ідеями. Дізнайтеся, як працює Zitadel і як його використовувати.
          TITLE: Документація
        EXAMPLES:
          DESCRIPTION: Перегляньте наші приклади та SDK для використання Zitadel разом з вашими улюбленими мовами програмування та інструментами.
          TITLE: Приклади та комплекти розробки програмного забезпечення
        GET_STARTED:
          DESCRIPTION: Слідуйте покроковому керівництву швидкого старту та почніть розробку негайно.
          TITLE: Почати роботу
      NEXT:
        CREATE_PROJECT:
          DESCRIPTION: Додайте проекти та визначте ролі та призначення ролей.
          TITLE: Створіть проект
        DESCRIPTION: Виконайте наступні кроки для захисту вашого додатка.
        TITLE: Ваші наступні кроки
      TITLE: Почніть роботу з Zitadel
    METADATA_TITLE: Метадані
    ORG:
      DESCRIPTION: Організація містить користувачів, проекти з додатками, постачальників ідентичності та налаштування, такі як корпоративний брендинг. Хочете поділитися налаштуваннями між кількома організаціями? Налаштуйте параметри за замовчуванням.
      METADATA: Додайте власні атрибути до організації, такі як її місцезнаходження або ідентифікатор в іншій системі. Ви можете використовувати цю інформацію у своїх діях.
      TITLE: Організація
    PROJECTS:
      DESCRIPTION: Проект містить одну або кілька програм, які ви можете використовувати для автентифікації ваших користувачів. Також ви можете авторизувати своїх користувачів за допомогою проектів. Щоб дозволити користувачам з інших організацій входити до ваших додатків, надайте їм доступ до вашого проекту.<br/><br/>Якщо ви не можете знайти проект, зверніться до власника проекту або до когось з відповідними правами для отримання доступу.
      GRANTED:
        DESCRIPTION: Це проекти, які інші організації надали вам. За допомогою наданих проектів ви можете надавати своїм користувачам доступ до додатків інших організацій.
        TITLE: Надані проекти
      OWNED:
        DESCRIPTION: Це проекти, які належать вам. Ви можете керувати їхніми налаштуваннями, призначеннями ролей та додатками.
        TITLE: Власні проекти
      TITLE: Проекти
    ROLE_ASSIGNMENTS:
      DESCRIPTION: Призначення ролей визначають права доступу користувача до проекту. Ви можете надати користувачу доступ до проекту та визначити ролі користувача в цьому проекті.
      TITLE: Призначення ролей
    SETTINGS:
      BRANDING:
        DESCRIPTION: Налаштуйте зовнішній вигляд вашої форми входу. Не забудьте застосувати вашу конфігурацію після завершення.
        TITLE: Брендинг
      DOMAINS:
        DESCRIPTION: Визначте обмеження на ваші домени та налаштуйте шаблони імен входу.
        DOMAIN_VERIFICATION:
          DESCRIPTION: Дозволяти вашій організації використовувати лише домени, які вона фактично контролює. Якщо активовано, домени організації періодично перевіряються за допомогою DNS або HTTP виклику перш ніж їх можна буде використовувати. Це функція безпеки для запобігання захоплення домену.
          TITLE: Підтвердження домену
        LOGIN_NAME_PATTERN:
          DESCRIPTION: Контролюйте шаблон імен входу ваших користувачів. Zitadel вибирає організацію ваших користувачів, як тільки вони вводять своє ім'я входу. Тому імена входу повинні бути унікальними в усіх організаціях. Якщо у вас є користувачі, які мають обліковий запис у кількох доменах, ви можете забезпечити унікальність, додавши суфікс до своїх імен входу з доменом організації.
          TITLE: Шаблон імені входу
        REQUIRE_VERIFICATION:
          DESCRIPTION: Якщо це активовано, домени організації повинні бути підтверджені перш ніж їх можна буде використовувати для виявлення домену або додавання суфікса до імені користувача.
          TITLE: Вимагати підтвердження власних доменів
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: Дозволяти адресу відправника SMTP лише якщо вона відповідає одному з доменів вашого екземпляра.
          TITLE: Адреса відправника SMTP
        TITLE: Налаштування доменів
      FEATURES:
        DESCRIPTION: Розблокуйте функції для вашого екземпляра.
        TITLE: Налаштування функцій
      IAM_EVENTS:
        DESCRIPTION: Ця сторінка показує всі зміни стану у вашому екземплярі в межах ліміту аудиторського сліду вашого екземпляра. Фільтруйте список за часовим діапазоном для цілей налагодження або фільтруйте його за агрегатом для цілей аудиту.
        TITLE: Події
      IAM_FAILED_EVENTS:
        DESCRIPTION: Ця сторінка показує всі невдалі події у вашому екземплярі. Якщо Zitadel поводиться не так, як ви очікуєте, завжди перевіряйте цей список спочатку.
        TITLE: Невдалі події
      IAM_VIEWS:
        DESCRIPTION: Ця сторінка показує всі ваші перегляди бази даних та коли вони обробили свою останню подію. Якщо ви не бачите деяких даних, перевірте, чи є перегляд актуальним.
        TITLE: Перегляди
      IDPS:
        ACTIVATE:
          DESCRIPTION: Ваш IdP ще не активний. Активуйте його, щоб дозволити вашим користувачам входити.
          TITLE: Активуйте IdP
        AUTOFILL:
          DESCRIPTION: Використовуйте дію для покращення досвіду ваших користувачів. Ви можете попередньо заповнити форму реєстрації Zitadel значеннями від постачальника ідентичності.
          TITLE: Автозаповнення даних користувача
        CALLBACK:
          DESCRIPTION: Перш ніж налаштовувати Zitadel, передайте цей URL вашому постачальнику ідентичності, щоб увімкнути перенаправлення браузера назад до Zitadel після автентифікації.
          TITLE: Налаштуйте свого {{ provider }} постачальника ідентичності
        DESCRIPTION: Створюйте та активуйте зовнішніх постачальників ідентичності. Виберіть відомого постачальника або налаштуйте будь-якого іншого OIDC, OAuth або SAML сумісного постачальника на ваш вибір. Ви навіть можете використовувати свої існуючі JWT токени як федеровані ідентичності, налаштувавши JWT постачальника ідентичності.
        JWT:
          DESCRIPTION: JWT постачальник ідентичності дозволяє використовувати ваші існуючі JWT токени як федеровані ідентичності. Ця функція корисна, якщо у вас вже є емітент для JWT. З JWT IdP ви можете використовувати ці JWT для створення та оновлення користувачів у Zitadel на льоту.
          TITLE: Використовуйте JWT як федеровані ідентичності
        LDAP:
          DESCRIPTION: Надайте деталі підключення до вашого LDAP сервера та налаштуйте зіставлення ваших LDAP атрибутів з атрибутами Zitadel.
          TITLE: Налаштуйте Zitadel для підключення до вашого LDAP постачальника ідентичності
        NEXT: Що далі?
        SAML:
          DESCRIPTION: Zitadel налаштований. Тепер ваш SAML постачальник ідентичності потребує деяких налаштувань. Більшість постачальників дозволяють просто завантажити весь Zitadel metadata XML. Інші постачальники просять надати лише певні URL, наприклад, entity ID (metadata URL), Assertion Consumer Service (ACS) URL або Single Logout URL.
          TITLE: Налаштуйте свого SAML постачальника ідентичності
        TITLE: Постачальники ідентичності
      INSTANCE:
        DESCRIPTION: Параметри за замовчуванням для всіх організацій. З відповідними дозволами деякі з них можна перевизначити в налаштуваннях організації.
        TITLE: Налаштування екземпляра
      LANGUAGES:
        DESCRIPTION: Обмежте мови, на які перекладаються форма входу та сповіщення. Якщо ви хочете відключити деякі мови, перетягніть їх до розділу Заборонені мови. Ви можете вказати дозволену мову як мову за замовчуванням. Якщо бажана мова користувача не дозволена, використовується мова за замовчуванням.
        TITLE: Мови
      LOGIN:
        FORM:
          DESCRIPTION: Налаштуйте форму входу.
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: Якщо це активовано, ваші користувачі не можуть використовувати свої адреси електронної пошти для входу. Майте на увазі, що якщо ви деактивуєте це, адреси електронної пошти ваших користувачів повинні бути унікальними в усіх організаціях для входу.
            TITLE: Вимкнути вхід через електронну пошту
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: Якщо це активовано, ваші користувачі не можуть використовувати свої номери телефонів для входу. Майте на увазі, що якщо ви деактивуєте це, номери телефонів ваших користувачів повинні бути унікальними в усіх організаціях для входу.
            TITLE: Вимкнути вхід через телефон
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: Знаходити організації ваших користувачів залежно від домену їх імен входу, наприклад, їх адреси електронної пошти.
            TITLE: Дозволено виявлення домену
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: Дозволити вашим користувачам входити з зовнішнім постачальником ідентичності замість використання користувача Zitadel для входу.
            TITLE: Дозволений зовнішній вхід
          HIDE_PASSWORD_RESET:
            DESCRIPTION: Не дозволяти вашим користувачам скидати свій пароль.
            TITLE: Скидання пароля приховано
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: Якщо це активовано, форма входу не покаже повідомлення про помилку, якщо ім'я користувача невідоме. Це допомагає запобігти відгадуванню імен користувачів.
            TITLE: Ігнорувати невідомі імена користувачів
          LOCAL_AUTHENTICATION_ALLOWED:
            DESCRIPTION: Дозвольте користувачам входити за допомогою імені користувача та пароля або автентифікації за ключем доступу (passkey). Якщо цю опцію вимкнено, користувачі зможуть увійти лише через зовнішнього постачальника ідентифікації.
            TITLE: Дозволена локальна автентифікація
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: Дозволити анонімним користувачам створювати організацію.
            TITLE: Дозволена реєстрація організації
          TITLE: Форма входу
          USER_REGISTRATION_ALLOWED:
            DESCRIPTION: Дозволити анонімним користувачам створювати обліковий запис.
            TITLE: Дозволена реєстрація користувача
        LIFETIMES:
          DESCRIPTION: Посиліть свою безпеку, скоротивши деякі максимальні терміни, пов'язані з входом.
          EXT_LOGIN_CHECK:
            DESCRIPTION: Ваші користувачі перенаправляються до своїх зовнішніх постачальників ідентичності після цих періодів.
            TITLE: Перевірка зовнішнього входу
          LABEL: Максимальний час життя в годинах
          MULTI_FACTOR_CHECK:
            DESCRIPTION: Ваші користувачі повинні повторно підтвердити свою багатофакторну автентифікацію в ці періоди.
            TITLE: Перевірка багатофакторної автентифікації
          MULTI_FACTOR_INIT:
            DESCRIPTION: Ваші користувачі будуть запропоновані налаштувати другий фактор або багатофакторну автентифікацію після цих періодів, якщо вони ще цього не зробили. Час життя 0 деактивує це запрошення.
            TITLE: Перевірка ініціалізації багатофакторної автентифікації
          PW_CHECK:
            DESCRIPTION: Користувачі будуть зобов'язані повторно автентифікуватися своїм паролем після цього періоду.
            TITLE: Перевірка пароля
          SECOND_FACTOR_CHECK:
            DESCRIPTION: Ваші користувачі повинні повторно підтвердити свій другий фактор в ці періоди.
            TITLE: Перевірка другого фактора
          TITLE: Час життя входу
      LOGIN_TEXTS:
        DESCRIPTION: Налаштуйте тексти вашої форми входу. Якщо текст порожній, заповнювач показує значення за замовчуванням. Якщо ви хочете відключити деякі мови, обмежте їх у налаштуваннях мов вашого екземпляра.
        TITLE: Тексти інтерфейсу входу
      MESSAGE_TEXTS:
        DESCRIPTION: Налаштуйте тексти ваших сповіщень електронною поштою або SMS повідомлень. Якщо ви хочете відключити деякі мови, обмежте їх у налаштуваннях мов вашого екземпляра.
        TITLE: Тексти повідомлень
        TYPE_DESCRIPTIONS:
          DC: Коли ви заявляєте домен для вашої організації, користувачі, які не використовують цей домен у своєму імені входу, будуть запропоновані змінити своє ім'я входу відповідно до заявленого домену.
          INIT: Коли користувач створюється, він отримає електронний лист з посиланням для встановлення пароля.
          IU: Коли створюється код запрошення користувача, він отримає електронний лист з посиланням для встановлення свого методу автентифікації.
          PC: Коли користувач змінює свій пароль, він отримає сповіщення про зміну, якщо ви увімкнули це в налаштуваннях сповіщень.
          PL: Коли користувач додає метод автентифікації без пароля, йому потрібно активувати його, натиснувши посилання в електронному листі.
          PR: Коли користувач скидає свій пароль, він отримає електронний лист з посиланням для встановлення нового пароля.
          VE: Коли користувач змінює свою адресу електронної пошти, він отримає електронний лист з посиланням для підтвердження нової адреси.
          VEO: Коли користувач додає метод OTP через електронну пошту, йому потрібно активувати його, ввівши код, надісланий на адресу електронної пошти.
          VP: Коли користувач змінює свій номер телефону, він отримає SMS з кодом для підтвердження нового номера.
          VSO: Коли користувач додає метод OTP через SMS, йому потрібно активувати його, ввівши код, надісланий на номер телефону.
      OIDC:
        ACCESS_TOKEN:
          DESCRIPTION: Токен доступу використовується для автентифікації користувача. Це короткотривалий токен, який використовується для доступу до даних користувача. Використовуйте короткий час життя для мінімізації ризику несанкціонованого доступу. Токени доступу можуть автоматично оновлюватися за допомогою токена оновлення.
          TITLE: Токен доступу
        DESCRIPTION: Налаштуйте час життя ваших OIDC токенів. Використовуйте коротший час життя для підвищення безпеки ваших користувачів, використовуйте довший час життя для підвищення зручності ваших користувачів.
        ID_TOKEN:
          DESCRIPTION: ID токен - це JSON Web Token (JWT), який містить заявки про користувача. Час життя ID токена не повинен перевищувати час життя токена доступу.
          TITLE: ID токен
        LABEL_DAYS: Максимальний час життя в днях
        LABEL_HOURS: Максимальний час життя в годинах
        REFRESH_TOKEN:
          DESCRIPTION: Токен оновлення використовується для отримання нового токена доступу. Це довготривалий токен, який використовується для оновлення токена доступу. Користувач повинен вручну пройти повторну автентифікацію, коли токен оновлення закінчується.
          TITLE: Токен оновлення
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: Час життя простою токена оновлення - це максимальний час, протягом якого токен оновлення може бути невикористаним.
          TITLE: Простій токена оновлення
        TITLE: Налаштування OpenID Connect
      ORG:
        DESCRIPTION: Налаштуйте параметри вашої організації.
        TITLE: Налаштування організації
      PRIVACY_POLICY:
        DESCRIPTION: Направляйте ваших користувачів до власних зовнішніх ресурсів, що відображаються на сторінці входу. Користувачі повинні прийняти Умови використання та Політику конфіденційності перш ніж зможуть зареєструватися. Змініть посилання на вашу документацію або встановіть порожній рядок, щоб приховати кнопку документації з консолі управління. Додайте власне зовнішнє посилання та власний текст для цього посилання в консолі управління, або встановіть їх порожніми, щоб приховати цю кнопку.
        TITLE: Зовнішні посилання
      PW_COMPLEXITY:
        DESCRIPTION: Забезпечте використання ваших користувачів міцних паролів, визначивши правила складності.
        TITLE: Складність пароля
      SECRET_GENERATORS:
        DESCRIPTION: Визначте складність та час життя ваших секретів. Більша складність та час життя покращує безпеку, менша складність та час життя покращує продуктивність розшифрування.
        TITLE: Генератори секретів
      SECURITY:
        DESCRIPTION: Увімкніть функції Zitadel, які можуть мати вплив на безпеку. Ви дійсно повинні знати, що робите, перш ніж змінювати ці налаштування.
        TITLE: Налаштування безпеки
      SMS_PROVIDER:
        DESCRIPTION: Щоб розблокувати всі функції Zitadel, налаштуйте Twilio для надсилання SMS повідомлень вашим користувачам.
        TITLE: Налаштування SMS
      SMTP_PROVIDER:
        DESCRIPTION: Налаштуйте свій SMTP сервер для використання домену для адреси відправника, який ваші користувачі знають і якому довіряють.
        TITLE: Налаштування SMTP
      WEB_KEYS:
        CREATE:
          BITS: Біти
          CURVE: Крива
          DESCRIPTION: Створення нового веб-ключа додає його до вашого списку. Zitadel використовує RSA2048 ключі з SHA256 хешером за замовчуванням.
          HASHER: Хешер
          KEY_TYPE: Тип ключа
          TITLE: Створити новий веб-ключ
        DESCRIPTION: Керуйте своїми OIDC веб-ключами для безпечного підпису та валідації токенів для вашого екземпляра Zitadel.
        PREVIOUS_TABLE:
          DEACTIVATED_ON: Деактивовано
          DESCRIPTION: Це ваші попередні веб-ключі, які більше не активні.
          TITLE: Попередні веб-ключі
        TABLE:
          ACTIVATE: Активувати наступний веб-ключ
          ACTIVE: Зараз активний
          DESCRIPTION: Ваші активні та майбутні веб-ключі. Активація нового ключа деактивує поточний.
          FUTURE: Майбутній
          NEXT: Наступний у черзі
          NOTE: 'Примітка: JWKs OIDC ендпоінт повертає кешовану відповідь (за замовчуванням 5 хв). Уникайте активації ключа занадто рано, оскільки він може бути ще недоступний для кешів та додатків.'
          TITLE: Активні та майбутні веб-ключі
          WARNING: Веб-ключ створений менше ніж 5 хв тому
    USERS:
      DESCRIPTION: Користувач - це людина або обліковий запис служби, який може отримати доступ до ваших додатків.
      HUMANS:
        DESCRIPTION: Користувачі автентифікуються інтерактивно в сеансі браузера за допомогою запиту входу.
        METADATA: Додайте власні атрибути до користувача, такі як відділ. Ви можете використовувати цю інформацію у своїх діях.
        TITLE: Користувачі
      MACHINES:
        DESCRIPTION: Облікові записи служби автентифікуються неінтерактивно, використовуючи JWT bearer токен, підписаний приватним ключем. Вони також можуть використовувати персональний токен доступу.
        METADATA: Додайте власні атрибути до облікового запису, такі як система автентифікації. Ви можете використовувати цю інформацію у своїх діях.
        TITLE: Облікові записи служби
      SELF:
        METADATA: Додайте власні атрибути до свого користувача, такі як ваш відділ. Ви можете використовувати цю інформацію в діях вашої організації.
      TITLE: Користувачі
