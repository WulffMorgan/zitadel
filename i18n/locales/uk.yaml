      DESCRIPTION: Виконуйте власний код на події, які відбуваються під час автентифікації ваших користувачів у Zitadel. Автоматизуйте свої процеси, збагачуйте метадані ваших користувачів та їх токени або сповіщайте зовнішні системи.
