  DESCRIPTIONS:
    ACTIONS:
      ACTIONSTWO_NOTE: Actions V2, eine neue und verbesserte Version von Actions, ist jetzt verfügbar. Die aktuelle Version ist weiterhin zugänglich, aber unsere zukünftige Entwicklung wird sich auf die neue Version konzentrieren, die schließlich die aktuelle ersetzen wird.
      DESCRIPTION: Führe eigenen Code bei Ereignissen aus, die auftreten, während sich deine Benutzer bei Zitadel authentifizieren. Automatisiere deine Prozesse, erweitere die Metadaten deiner Benutzer und deren Token oder benachrichtige externe Systeme.
      FLOWS:
