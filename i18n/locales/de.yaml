          JSON: Standard-JSON-Payload mit einem Signatur-Header zur Verifikation.
          JWT: Der Payload wird als signiertes JWT gesendet. Die Verifikation erfolgt über die JWT-Signatur.
          JWE: Das JWT wird zusätzlich verschlüsselt, um unautorisierten Zugriff auf die Payloadinformationen zu verhindern.
        TIMEOUT: Timeout
        TIMEOUT_DESCRIPTION: Legen Sie die maximale Zeit fest, die Ihr Ziel zum Antworten hat. Wenn es länger dauert, stoppen wir die Anfrage.
