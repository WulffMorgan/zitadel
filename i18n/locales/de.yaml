          restAsync: REST Asynchron
          restCall: REST Aufruf
          restWebhook: REST Webhook
        TYPES_DESCRIPTION: |-
          Webhook, der Aufruf verarbeitet den Statuscode, aber die Antwort ist irrelevant
          Call, der Aufruf verarbeitet den Statuscode und die Antwort
          Async, der Aufruf verarbeitet weder Statuscode noch Antwort, kann aber parallel zu anderen Zielen aufgerufen werden
      DESCRIPTION: Ein Ziel ist das Ziel des Codes, den Sie von einer Aktion ausführen möchten. Erstellen Sie hier ein Ziel und fügen Sie es Ihren Aktionen hinzu.
