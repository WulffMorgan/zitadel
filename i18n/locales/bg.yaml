      PRIVACY_POLICY:
        DESCRIPTION: Насочете потребителите си към персонализирани външни ресурси, показани на страницата за вход. Потребителите трябва да приемат Общите условия и Политиката за поверителност, преди да могат да се регистрират. Променете връзката към вашата документация или задайте празен низ, за ​​да скриете бутона за документация от конзолата за управление. Добавете персонализирана външна връзка и персонализиран текст за тази връзка в конзолата за управление или ги оставете празни, за да скриете този бутон.
