      METADATA: 조직에 위치나 다른 시스템의 식별자와 같은 맞춤 속성을 추가하세요. 이 정보를 작업에 활용할 수 있습니다.
      TITLE: 조직
    PROJECTS:
      DESCRIPTION: 프로젝트는 하나 이상의 애플리케이션을 호스팅하여 사용자를 인증할 수 있습니다. 예를 들어, 웹 프론트엔드, 모바일 애플리케이션, 백엔드용으로 각각 하나씩, 총 3개의 애플리케이션을 가진 단일 프로젝트를 가질 수 있습니다. 또한 프로젝트를 통해 사용자에게 권한을 부여할 수 있습니다. 다른 조직의 사용자가 애플리케이션에 로그인할 수 있도록 프로젝트에 대한 액세스를 부여하세요.<br/><br/>프로젝트를 찾을 수 없는 경우 프로젝트 소유자 또는 관련 권한이 있는 사람에게 문의하여 액세스를 얻으세요.
      GRANTED:
        DESCRIPTION: 다른 조직에서 사용자가 부여받은 프로젝트입니다. 부여된 프로젝트를 통해 사용자가 다른 조직의 애플리케이션에 액세스할 수 있습니다.
        TITLE: 부여된 프로젝트
      OWNED:
        DESCRIPTION: 이 프로젝트는 사용자가 소유한 프로젝트입니다. 프로젝트 설정, 역할 할당 및 애플리케이션을 관리할 수 있습니다.
        TITLE: 소유한 프로젝트
      TITLE: 프로젝트
    ROLE_ASSIGNMENTS:
      DESCRIPTION: 역할 할당은 사용자의 프로젝트 접근 권한을 정의합니다. 사용자가 프로젝트에 액세스할 수 있도록 하고, 프로젝트 내의 역할을 정의할 수 있습니다.
      TITLE: 역할 할당
    SETTINGS:
      BRANDING:
        DESCRIPTION: 로그인 폼의 외관을 사용자 정의하세요. 설정을 완료한 후 구성 적용을 기억하세요.
        TITLE: 브랜딩
      DOMAINS:
        DESCRIPTION: 도메인에 대한 제한 사항을 정의하고 로그인 이름 패턴을 구성하세요.
        DOMAIN_VERIFICATION:
          DESCRIPTION: 조직이 실제로 제어하는 도메인만 사용할 수 있도록 합니다. 활성화되면 조직 도메인은 도메인 하이재킹 방지를 위해 DNS 또는 HTTP 검증을 통해 주기적으로 확인됩니다.
          TITLE: 도메인 확인
        LOGIN_NAME_PATTERN:
          DESCRIPTION: 사용자의 로그인 이름 패턴을 제어하세요. 사용자가 로그인 이름을 입력하는 즉시 Zitadel은 사용자의 조직을 선택합니다. 따라서 로그인 이름은 모든 조직에서 고유해야 합니다. 여러 도메인에 계정이 있는 사용자의 경우, 로그인 이름에 조직 도메인을 접미사로 붙여 고유성을 보장할 수 있습니다.
          TITLE: 로그인 이름 패턴
        REQUIRE_VERIFICATION:
          DESCRIPTION: 활성화된 경우, 조직 도메인은 도메인 검색이나 사용자 이름 접미사로 사용되기 전에 확인되어야 합니다.
          TITLE: 맞춤 도메인 확인 필요
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: 인스턴스 도메인 중 하나와 일치하는 경우에만 SMTP 발신 주소를 허용합니다.
          TITLE: SMTP 발신 주소
        TITLE: 도메인 설정
      FEATURES:
        DESCRIPTION: 인스턴스의 기능을 잠금 해제하세요.
        TITLE: 기능 설정
      IAM_EVENTS:
        DESCRIPTION: 인스턴스에서 상태 변경을 보여주는 페이지입니다. 디버깅을 위해 시간 범위별로 필터링하거나 감사 목적으로 특정 집계를 필터링하세요.
        TITLE: 이벤트
      IAM_FAILED_EVENTS:
        DESCRIPTION: 인스턴스에서 실패한 모든 이벤트가 표시됩니다. Zitadel이 예상대로 작동하지 않는 경우, 이 목록을 먼저 확인하세요.
        TITLE: 실패한 이벤트
      IAM_VIEWS:
        DESCRIPTION: 데이터베이스 뷰와 최근 이벤트가 처리된 시점을 보여주는 페이지입니다. 데이터가 누락된 경우, 뷰가 최신인지 확인하세요.
        TITLE: 뷰
      IDPS:
        ACTIVATE:
          DESCRIPTION: ID 제공자가 아직 활성화되지 않았습니다. 사용자가 로그인할 수 있도록 활성화하세요.
          TITLE: ID 제공자 활성화
        AUTOFILL:
          DESCRIPTION: 사용자 경험을 개선하기 위해 작업을 사용하세요. ID 제공자에서 값을 가져와 Zitadel의 등록 양식을 미리 채울 수 있습니다.
          TITLE: 사용자 데이터 자동 입력
        CALLBACK:
          DESCRIPTION: Zitadel을 구성하기 전에, 인증 후 Zitadel로 브라우저 리디렉션을 가능하게 하기 위해 이 URL을 ID 제공자에게 전달하세요.
          TITLE: '{{ provider }} ID 제공자 구성'
        DESCRIPTION: 외부 ID 제공자를 생성하고 활성화하세요. 알려진 제공자를 선택하거나 다른 OIDC, OAuth 또는 SAML 호환 제공자를 구성하세요. 기존 JWT 토큰을 사용하여 연합된 ID로 구성할 수도 있습니다.
        JWT:
          DESCRIPTION: JWT ID 제공자를 통해 기존 JWT 토큰을 연합된 ID로 사용할 수 있습니다. 이미 JWT 발급자가 있는 경우 이 기능이 유용합니다. JWT IdP를 사용하여 Zitadel에서 사용자 생성 및 업데이트를 실시간으로 수행할 수 있습니다.
          TITLE: JWT를 연합된 ID로 사용
        LDAP:
          DESCRIPTION: LDAP 서버의 연결 세부 정보를 제공하고, LDAP 속성을 Zitadel 속성에 매핑하세요.
          TITLE: LDAP ID 제공자에 Zitadel 연결 구성
        NEXT: 다음 단계는?
        SAML:
          DESCRIPTION: Zitadel이 구성되었습니다. 이제 SAML ID 제공자에 대한 일부 설정이 필요합니다. 대부분의 제공자는 Zitadel 메타데이터 XML 전체를 업로드하는 기능을 제공합니다. 일부 제공자는 메타데이터 URL, Assertion Consumer Service (ACS) URL, 또는 Single Logout URL과 같은 특정 URL만 제공합니다.
          TITLE: SAML ID 제공자 구성
        TITLE: ID 제공자
      INSTANCE:
        DESCRIPTION: 모든 조직에 대한 기본 설정입니다. 권한이 있으면 일부 설정을 조직 설정에서 재정의할 수 있습니다.
        TITLE: 기본 설정
      LANGUAGES:
        DESCRIPTION: 로그인 폼과 알림 메시지가 번역되는 언어를 제한하세요. 일부 언어를 비활성화하려면 '허용되지 않은 언어' 섹션으로 드래그하세요. 기본 언어로 허용된 언어를 지정할 수 있습니다. 사용자의 선호 언어가 허용되지 않으면 기본 언어가 사용됩니다.
        TITLE: 언어
      LOGIN:
        FORM:
          DESCRIPTION: 로그인 폼을 사용자 정의하세요.
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: 활성화된 경우, 사용자는 이메일 주소를 사용하여 로그인할 수 없습니다. 이 설정을 비활성화하면 모든 조직에서 사용자의 이메일 주소가 고유해야 합니다.
            TITLE: 이메일 로그인 비활성화
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: 활성화된 경우, 사용자는 전화번호를 사용하여 로그인할 수 없습니다. 이 설정을 비활성화하면 모든 조직에서 사용자의 전화번호가 고유해야 합니다.
            TITLE: 전화번호 로그인 비활성화
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: 예를 들어 이메일 주소와 같은 로그인 이름의 도메인에 따라 사용자의 조직을 찾습니다.
            TITLE: 도메인 검색 허용
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: 사용자가 Zitadel 사용자 대신 외부 ID 제공자를 통해 로그인할 수 있도록 허용하세요.
            TITLE: 외부 로그인 허용
          HIDE_PASSWORD_RESET:
            DESCRIPTION: 사용자가 비밀번호를 재설정할 수 없도록 허용하지 않습니다.
            TITLE: 비밀번호 재설정 숨기기
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: 활성화된 경우, 로그인 폼은 사용자 이름이 알 수 없는 경우에도 오류 메시지를 표시하지 않습니다. 이는 사용자 이름 추측을 방지하는 데 도움이 됩니다.
            TITLE: 알 수 없는 사용자 이름 무시
          LOCAL_AUTHENTICATION_ALLOWED:
            DESCRIPTION: 사용자가 사용자 이름과 비밀번호 또는 패스키 인증으로 로그인할 수 있도록 허용합니다. 이 기능이 비활성화되면 사용자는 외부 ID 제공업체를 통해서만 로그인할 수 있습니다.
            TITLE: 로컬 인증 허용
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: 익명 사용자가 조직을 생성할 수 있도록 허용하세요.
            TITLE: 조직 등록 허용
          TITLE: 로그인 폼
          USER_REGISTRATION_ALLOWED:
            DESCRIPTION: 익명 사용자가 계정을 생성할 수 있도록 허용하세요.
            TITLE: 사용자 등록 허용
        LIFETIMES:
          DESCRIPTION: 로그인 관련 최대 수명을 줄여 보안을 강화하세요.
          EXT_LOGIN_CHECK:
            DESCRIPTION: 지정된 기간 후 사용자는 외부 ID 제공자에게 리디렉션됩니다.
            TITLE: 외부 로그인 확인
          LABEL: 최대 수명 (시간)
          MULTI_FACTOR_CHECK:
            DESCRIPTION: 사용자는 지정된 기간 동안 다중 인증을 재확인해야 합니다.
            TITLE: 다중 인증 확인
          MULTI_FACTOR_INIT:
            DESCRIPTION: 사용자가 아직 설정하지 않은 경우, 지정된 기간 후 두 번째 인증 요소나 다중 인증을 설정하도록 안내합니다. 수명을 0으로 설정하면 이 안내가 비활성화됩니다.
            TITLE: 다중 인증 초기화 확인
          PW_CHECK:
            DESCRIPTION: 지정된 기간 후 사용자는 비밀번호로 재인증이 필요합니다.
            TITLE: 비밀번호 확인
          SECOND_FACTOR_CHECK:
            DESCRIPTION: 사용자는 지정된 기간 동안 두 번째 인증 요소를 재확인해야 합니다.
            TITLE: 두 번째 인증 요소 확인
          TITLE: 로그인 수명
      LOGIN_TEXTS:
        DESCRIPTION: 로그인 양식의 텍스트를 사용자 정의하세요. 텍스트가 비어 있으면 기본 값이 표시됩니다. 언어를 비활성화하려면 인스턴스의 언어 설정에서 제한하세요.
        TITLE: 로그인 인터페이스 텍스트
      MESSAGE_TEXTS:
        DESCRIPTION: 알림 이메일 또는 SMS 메시지의 텍스트를 사용자 정의하세요. 언어를 비활성화하려면 인스턴스의 언어 설정에서 제한하세요.
        TITLE: 메시지 텍스트
        TYPE_DESCRIPTIONS:
          DC: 조직의 도메인을 주장할 때, 해당 도메인을 로그인 이름에 사용하지 않는 사용자는 로그인 이름을 도메인에 맞게 변경하도록 요청받습니다.
          INIT: 사용자가 생성되면 비밀번호를 설정할 수 있는 링크가 포함된 이메일을 받게 됩니다.
          IU: 사용자 초대 코드가 생성되면 인증 방법을 설정할 수 있는 링크가 포함된 이메일을 받습니다.
          PC: 사용자가 비밀번호를 변경하면 알림 설정을 통해 변경 사항에 대한 알림을 받게 됩니다.
          PL: 사용자가 비밀번호 없는 인증 방식을 추가하면 이메일의 링크를 클릭하여 활성화해야 합니다.
          PR: 사용자가 비밀번호를 재설정할 때 새 비밀번호를 설정할 수 있는 링크가 포함된 이메일을 받습니다.
          VE: 사용자가 이메일 주소를 변경할 때, 새 주소를 확인할 수 있는 링크가 포함된 이메일을 받습니다.
          VEO: 사용자가 이메일을 통해 OTP를 추가할 때, 이메일 주소로 전송된 코드를 입력하여 활성화해야 합니다.
          VP: 사용자가 전화번호를 변경할 때, 새 번호를 확인할 수 있는 코드가 포함된 SMS를 받습니다.
          VSO: 사용자가 SMS를 통해 OTP를 추가할 때, 전화번호로 전송된 코드를 입력하여 활성화해야 합니다.
      OIDC:
        ACCESS_TOKEN:
          DESCRIPTION: 액세스 토큰은 사용자를 인증하는 데 사용되는 단기 토큰입니다. 사용자의 데이터를 접근하는 데 사용됩니다. 불법적인 접근 위험을 줄이기 위해 짧은 수명을 사용하세요. 액세스 토큰은 갱신 토큰을 사용하여 자동으로 갱신할 수 있습니다.
          TITLE: 액세스 토큰
        DESCRIPTION: OIDC 토큰 수명을 설정하세요. 짧은 수명은 사용자의 보안을 강화하고, 긴 수명은 사용자의 편의를 증가시킵니다.
        ID_TOKEN:
          DESCRIPTION: ID 토큰은 사용자에 대한 정보를 포함하는 JSON 웹 토큰(JWT)입니다. ID 토큰 수명은 액세스 토큰 수명을 초과해서는 안 됩니다.
          TITLE: ID 토큰
        LABEL_DAYS: 최대 수명 (일)
        LABEL_HOURS: 최대 수명 (시간)
        REFRESH_TOKEN:
          DESCRIPTION: 갱신 토큰은 새로운 액세스 토큰을 얻는 데 사용되는 장기 토큰입니다. 갱신 토큰이 만료되면 사용자가 수동으로 재인증해야 합니다.
          TITLE: 갱신 토큰
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: 유휴 갱신 토큰 수명은 갱신 토큰이 사용되지 않는 최대 기간을 의미합니다.
          TITLE: 유휴 갱신 토큰
        TITLE: OpenID Connect 설정
      ORG:
        DESCRIPTION: 조직의 설정을 사용자 정의하세요.
        TITLE: 조직 설정
      PRIVACY_POLICY:
        DESCRIPTION: 사용자가 로그인 페이지에서 커스텀 외부 리소스로 안내됩니다. 사용자는 가입 전에 이용 약관과 개인정보처리방침을 수락해야 합니다. 문서 링크를 변경하거나, 관리 콘솔에서 문서 버튼을 숨기려면 빈 문자열로 설정하세요. 사용자 정의 외부 링크와 그 링크에 대한 설명을 관리 콘솔에 추가하거나, 버튼을 숨기려면 빈 값으로 설정하세요.
        TITLE: 외부 링크
      PW_COMPLEXITY:
        DESCRIPTION: 사용자가 복잡한 비밀번호를 사용하도록 규칙을 정의하여 보안을 강화하세요.
        TITLE: 비밀번호 복잡성
      SECRET_GENERATORS:
        DESCRIPTION: 시크릿의 복잡성과 수명을 정의하세요. 높은 복잡성과 긴 수명은 보안을 강화하고, 낮은 복잡성과 짧은 수명은 암호 해독 성능을 향상시킵니다.
        TITLE: 시크릿 생성기
      SECURITY:
        DESCRIPTION: 보안에 영향을 미칠 수 있는 Zitadel 기능을 활성화하세요. 설정을 변경하기 전에 주의 깊게 검토하세요.
        TITLE: 보안 설정
      SMS_PROVIDER:
        DESCRIPTION: Zitadel의 모든 기능을 사용하려면 Twilio를 설정하여 사용자에게 SMS 메시지를 보내세요.
        TITLE: SMS 설정
      SMTP_PROVIDER:
        DESCRIPTION: 사용자가 신뢰할 수 있는 도메인을 발신자 주소로 사용하는 SMTP 서버를 구성하세요.
        TITLE: SMTP 설정
      WEB_KEYS:
        CREATE:
          BITS: 비트
          CURVE: 곡선
          DESCRIPTION: 새 웹 키를 생성하면 목록에 추가됩니다. Zitadel은 기본적으로 RSA2048 키와 SHA256 해시 알고리즘을 사용합니다.
          HASHER: 해시 알고리즘
          KEY_TYPE: 키 유형
          TITLE: 새 웹 키 생성
        DESCRIPTION: Zitadel 인스턴스의 토큰을 안전하게 서명하고 검증하기 위해 OIDC 웹 키를 관리하세요.
        PREVIOUS_TABLE:
          DEACTIVATED_ON: 비활성화된 날짜
          DESCRIPTION: 더 이상 활성 상태가 아닌 이전 웹 키 목록입니다.
          TITLE: 이전 웹 키
        TABLE:
          ACTIVATE: 다음 웹 키 활성화
          ACTIVE: 현재 활성화됨
          DESCRIPTION: 현재 활성화된 웹 키와 앞으로 활성화될 웹 키입니다. 새로운 키를 활성화하면 기존 키는 비활성화됩니다.
          FUTURE: 향후 사용 예정
          NEXT: 대기 중인 다음 키
          NOTE: '참고: JWKs OIDC 엔드포인트는 캐시 가능한 응답을 반환합니다 (기본값: 5분). 키를 너무 빨리 활성화하면 캐시 및 애플리케이션에서 아직 사용할 수 없을 수 있습니다.'
          TITLE: 활성 및 예정된 웹 키
          WARNING: 웹 키가 5분 미만입니다.
    USERS:
      DESCRIPTION: 사용자는 애플리케이션에 액세스할 수 있는 사람 또는 서비스 계정입니다.
      HUMANS:
        DESCRIPTION: 사용자는 로그인 프롬프트로 브라우저 세션에서 상호 인증을 수행합니다.
        METADATA: 부서와 같은 사용자 정의 속성을 사용자에게 추가하세요. 이 정보를 작업에 사용할 수 있습니다.
        TITLE: 사용자
      MACHINES:
        DESCRIPTION: 서비스 계정은 개인 키로 서명된 JWT bearer 토큰을 사용하여 비대화형 인증을 수행합니다. 또한 개인 액세스 토큰을 사용할 수 있습니다.
        METADATA: 인증 시스템과 같은 사용자 정의 속성을 사용자에게 추가하세요. 이 정보를 작업에 사용할 수 있습니다.
        TITLE: 서비스 계정
      SELF:
        METADATA: 부서와 같은 사용자 정의 속성을 사용자에게 추가하세요. 이 정보를 조직의 작업에 사용할 수 있습니다.
      TITLE: 사용자
  ERRORS:
    ATLEASTONE: 하나 이상의 값을 제공하세요.
    EXHAUSTED:
      DESCRIPTION: Zitadel 인스턴스 관리자에게 구독을 업데이트하도록 요청하세요.
      TITLE: 인스턴스가 차단되었습니다.
    INVALID_FORMAT: 형식이 유효하지 않습니다.
    LOWERCASEMISSING: 소문자가 포함되어야 합니다.
    MAXLENGTH: '{{requiredLength}}자 이하이어야 합니다.'
    MINLENGTH: '{{requiredLength}}자 이상이어야 합니다.'
    NOTANEMAIL: 입력된 값이 이메일 주소가 아닙니다.
    NUMBERERROR: 숫자가 포함되어야 합니다.
    PHONE: 전화번호는 +로 시작해야 합니다.
    PWNOTEQUAL: 입력된 비밀번호가 일치하지 않습니다.
    REQUIRED: 이 필드를 입력하세요.
    SYMBOLERROR: 기호나 구두점이 포함되어야 합니다.
    TOKENINVALID:
      DESCRIPTION: 다시 로그인하려면 아래 버튼을 클릭하세요.
      TITLE: 인증 토큰이 만료되었습니다.
    UPPERCASEMISSING: 대문자가 포함되어야 합니다.
  FILTER:
    DISPLAYNAME: 사용자 표시 이름
    EMAIL: 이메일
    METHODS:
      "1": 와 일치
      "5": 포함
      "7": 로 끝남
    ORGID: 조직 ID
    ORGNAME: 조직 이름
    PRIMARYDOMAIN: 조직 도메인
    PROJECTNAME: 프로젝트 이름
    RESOURCEOWNER: 리소스 소유자
    STATE: 상태
    TITLE: 필터
    USERNAME: 사용자 이름
  FLOWS:
    ACTIONS: 작업
    ACTIONSMAX: 사용 가능한 작업의 수는 티어에 따라 제한됩니다 ({{value}}). 필요하지 않은 작업은 비활성화하거나 티어 업그레이드를 고려하세요.
    ADDTRIGGER: 트리거 추가
    ALLOWEDTOFAIL: 실패 허용
    ALLOWEDTOFAILWARN:
      DESCRIPTION: 이 설정을 비활성화하면 조직 내 사용자가 로그인할 수 없게 될 수 있습니다. 또한, 관리 콘솔에 다시 접근하여 작업을 비활성화할 수 없게 됩니다. 별도의 조직에서 관리자 계정을 만들거나 개발 환경 또는 개발 조직에서 스크립트를 먼저 테스트할 것을 권장합니다.
      TITLE: 경고
    DIALOG:
      ABOUTNAME: 작업 이름과 자바스크립트 함수 이름은 동일해야 합니다
      ADD:
        TITLE: 작업 생성
      CLEAR:
        DESCRIPTION: 트리거 및 작업과 함께 플로우를 초기화하려고 합니다. 이 변경 사항은 복구할 수 없습니다. 확실합니까?
        TITLE: 플로우 초기화?
      DELETEACTION:
        DELETE_SUCCESS: 작업이 성공적으로 삭제되었습니다.
        DESCRIPTION: 작업을 삭제하려고 합니다. 이 작업은 되돌릴 수 없습니다. 확실합니까?
        TITLE: 작업 삭제?
      REMOVEACTIONSLIST:
        DESCRIPTION: 선택한 작업을 플로우에서 삭제하시겠습니까?
        TITLE: 선택한 작업 삭제?
