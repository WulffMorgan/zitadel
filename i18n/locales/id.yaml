        DESCRIPTION: Selesaikan langkah-langkah berikut untuk mengamankan aplikasi Anda.
        TITLE: Langkah Anda selanjutnya
      TITLE: Mulailah dengan Zitadel
    METADATA_TITLE: Metadata
    ORG:
      DESCRIPTION: Organisasi menampung pengguna, proyek dengan aplikasi, penyedia identitas, dan pengaturan seperti branding perusahaan. Apakah Anda ingin berbagi pengaturan di beberapa organisasi? Konfigurasikan pengaturan default.
      METADATA: Tambahkan atribut khusus ke organisasi seperti lokasinya atau pengidentifikasi di sistem lain. Anda dapat menggunakan informasi ini dalam tindakan Anda.
      TITLE: Organisasi
    PROJECTS:
      DESCRIPTION: Sebuah proyek menghosting satu atau beberapa aplikasi, yang dapat Anda gunakan untuk mengautentikasi pengguna Anda. Misalnya, Anda mungkin memiliki satu proyek dengan 3 aplikasi; satu untuk frontend web Anda, satu untuk aplikasi seluler Anda, dan satu untuk backend Anda. Anda juga dapat mengotorisasi pengguna Anda dengan proyek. Untuk mengizinkan pengguna dari organisasi lain masuk ke aplikasi Anda, beri mereka akses ke proyek Anda.<br/><br/>Jika Anda tidak dapat menemukan proyek, hubungi pemilik proyek atau seseorang dengan hak yang sesuai untuk mendapatkan akses .
      GRANTED:
        DESCRIPTION: Ini adalah proyek yang diberikan organisasi lain kepada Anda. Dengan proyek yang diberikan, Anda dapat memberikan pengguna Anda akses ke aplikasi organisasi lain.
        TITLE: Proyek yang Diberikan
      OWNED:
        DESCRIPTION: Ini adalah proyek yang Anda miliki. Anda dapat mengelola pengaturan, penugasan peran, dan aplikasi proyek ini.
        TITLE: Proyek Milik
      TITLE: Proyek
    ROLE_ASSIGNMENTS:
      DESCRIPTION: Penugasan peran menentukan hak akses pengguna ke suatu proyek. Anda dapat memberikan akses pengguna ke suatu proyek dan menentukan peran pengguna dalam proyek tersebut.
      TITLE: Penugasan Peran
    SETTINGS:
      BRANDING:
        DESCRIPTION: Sesuaikan tampilan dan nuansa formulir login Anda. Ingatlah untuk menerapkan konfigurasi Anda setelah selesai.
        TITLE: merek
      DOMAINS:
        DESCRIPTION: Tentukan batasan pada domain Anda dan konfigurasikan pola nama login Anda.
        DOMAIN_VERIFICATION:
          DESCRIPTION: Hanya izinkan organisasi Anda menggunakan domain yang sebenarnya mereka kendalikan. Jika diaktifkan, domain organisasi diverifikasi secara berkala oleh tantangan DNS atau HTTP sebelum dapat digunakan. Ini adalah fitur keamanan untuk mencegah pembajakan domain.
          TITLE: Verifikasi Domain
        LOGIN_NAME_PATTERN:
          DESCRIPTION: Kontrol pola nama login pengguna Anda. Zitadel memilih organisasi pengguna Anda segera setelah mereka memasukkan nama login mereka. Oleh karena itu, nama login harus unik di semua organisasi. Jika Anda memiliki pengguna yang memiliki akun di beberapa domain, Anda dapat memastikan keunikan dengan menambahkan nama login Anda ke domain organisasi.
          TITLE: Pola Nama Masuk
        REQUIRE_VERIFICATION:
          DESCRIPTION: Jika ini diaktifkan, domain organisasi harus diverifikasi sebelum dapat digunakan untuk penemuan domain atau akhiran nama pengguna.
          TITLE: Wajibkan domain khusus untuk diverifikasi
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: Hanya izinkan alamat pengirim SMTP jika cocok dengan salah satu domain instans Anda.
          TITLE: Alamat Pengirim SMTP
        TITLE: Pengaturan Domain
      FEATURES:
        DESCRIPTION: Buka kunci fitur untuk instans Anda.
        TITLE: Pengaturan Fitur
      IAM_EVENTS:
        DESCRIPTION: Halaman ini menampilkan semua perubahan status di instans Anda hingga batas jejak audit instans Anda. Filter daftar berdasarkan rentang waktu untuk tujuan debugging atau filter berdasarkan agregat untuk tujuan audit.
        TITLE: Acara
      IAM_FAILED_EVENTS:
        DESCRIPTION: Halaman ini menampilkan semua peristiwa yang gagal di instans Anda. Jika Zitadel tidak berperilaku seperti yang Anda harapkan, selalu periksa daftar ini terlebih dahulu.
        TITLE: Acara Gagal
      IAM_VIEWS:
        DESCRIPTION: Halaman ini memperlihatkan semua tampilan database Anda dan kapan mereka memproses peristiwa terbarunya. Jika Anda melewatkan beberapa data, periksa apakah tampilannya sudah yang terbaru.
        TITLE: Tampilan
      IDPS:
        ACTIVATE:
          DESCRIPTION: IdP Anda belum aktif. Aktifkan untuk memungkinkan pengguna Anda masuk.
          TITLE: Aktifkan IdP
        AUTOFILL:
          DESCRIPTION: Gunakan tindakan untuk meningkatkan pengalaman pengguna Anda. Anda dapat mengisi formulir pendaftaran Zitadel terlebih dahulu dengan nilai dari penyedia identitas.
          TITLE: Isi otomatis data pengguna
        CALLBACK:
          DESCRIPTION: Sebelum Anda dapat mengonfigurasi Zitadel, teruskan URL ini ke Penyedia Identitas Anda untuk mengaktifkan pengalihan browser kembali ke Zitadel setelah autentikasi.
          TITLE: Konfigurasikan {{ provider }} Penyedia Identitas Anda
        DESCRIPTION: Buat dan aktifkan penyedia identitas eksternal. Pilih penyedia terkenal atau konfigurasikan penyedia lain yang kompatibel dengan OIDC, OAuth, atau SAML pilihan Anda. Anda bahkan dapat menggunakan token JWT yang ada sebagai identitas gabungan dengan mengonfigurasi penyedia identitas JWT.
        JWT:
          DESCRIPTION: Penyedia Identitas JWT memungkinkan Anda menggunakan token JWT yang ada sebagai identitas gabungan. Fitur ini berguna jika Anda sudah memiliki penerbit JWT. Dengan IdP JWT, Anda dapat menggunakan JWT ini untuk membuat dan memperbarui pengguna di Zitadel dengan cepat.
          TITLE: Gunakan JWT sebagai Identitas gabungan
        LDAP:
          DESCRIPTION: Berikan detail koneksi ke server LDAP Anda dan konfigurasikan pemetaan atribut LDAP Anda ke atribut Zitadel.
          TITLE: Konfigurasikan Zitadel untuk terhubung ke Penyedia Identitas LDAP Anda
        NEXT: Bagaimana sekarang?
        SAML:
          DESCRIPTION: Zitadel dikonfigurasi. Sekarang Penyedia Identitas SAML Anda memerlukan beberapa konfigurasi. Sebagian besar penyedia mengizinkan Anda mengunggah seluruh XML metadata Zitadel. Penyedia lain meminta Anda untuk memberikan beberapa URL berbeda saja, misalnya ID entitas (URL metadata), URL Assertion Consumer Service (ACS), atau URL Keluar Tunggal.
          TITLE: Konfigurasikan Penyedia Identitas SAML Anda
        TITLE: Penyedia Identitas
      INSTANCE:
        DESCRIPTION: Setelan default untuk semua organisasi. Dengan izin yang tepat, beberapa di antaranya dapat diganti di pengaturan organisasi.
        TITLE: Pengaturan Bawaan
      LANGUAGES:
        DESCRIPTION: Batasi bahasa yang digunakan untuk menerjemahkan formulir login dan pesan notifikasi. Jika Anda ingin menonaktifkan beberapa bahasa, seret bahasa tersebut ke bagian Bahasa yang Tidak Diizinkan. Anda dapat menentukan bahasa yang diizinkan sebagai bahasa default. Jika bahasa pilihan pengguna tidak diperbolehkan, bahasa default akan digunakan.
        TITLE: Bahasa
      LOGIN:
        FORM:
          DESCRIPTION: Sesuaikan formulir login.
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: Jika ini diaktifkan, pengguna Anda tidak dapat menggunakan alamat email mereka untuk login. Hati-hati jika Anda menonaktifkan ini, alamat email pengguna Anda harus unik di semua organisasi agar dapat login.
            TITLE: Nonaktifkan Login Email
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: Jika ini diaktifkan, pengguna Anda tidak dapat menggunakan nomor telepon mereka untuk login. Hati-hati jika Anda menonaktifkan ini, nomor telepon pengguna Anda harus unik di semua organisasi agar dapat login.
            TITLE: Nonaktifkan Login Telepon
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: Temukan organisasi pengguna Anda bergantung pada nama login domain mereka, misalnya alamat email mereka.
            TITLE: Penemuan Domain diperbolehkan
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: Izinkan pengguna Anda untuk masuk dengan penyedia identitas eksternal alih-alih menggunakan pengguna Zitadel untuk masuk.
            TITLE: Login Eksternal diperbolehkan
          HIDE_PASSWORD_RESET:
            DESCRIPTION: Jangan izinkan pengguna Anda menyetel ulang sandi mereka.
            TITLE: Reset Kata Sandi disembunyikan
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: Jika diaktifkan, form login tidak akan menampilkan pesan error jika nama pengguna tidak diketahui. Ini membantu mencegah tebakan nama pengguna.
            TITLE: Abaikan Nama Pengguna yang tidak dikenal
          LOCAL_AUTHENTICATION_ALLOWED:
            DESCRIPTION: Izinkan pengguna Anda untuk masuk dengan nama pengguna dan kata sandi atau autentikasi passkey. Jika ini dinonaktifkan, pengguna Anda hanya dapat masuk menggunakan penyedia identitas eksternal.
            TITLE: Otentikasi lokal diizinkan
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: Izinkan pengguna anonim membuat organisasi.
            TITLE: Pendaftaran Organisasi diperbolehkan
          TITLE: Formulir Masuk
          USER_REGISTRATION_ALLOWED:
            DESCRIPTION: Izinkan pengguna anonim untuk membuat akun.
            TITLE: Pendaftaran Pengguna diperbolehkan
        LIFETIMES:
          DESCRIPTION: Perkuat keamanan Anda dengan mengurangi masa pakai maksimum terkait login.
          EXT_LOGIN_CHECK:
            DESCRIPTION: Pengguna Anda dialihkan ke penyedia identitas eksternal mereka pada periode ini.
            TITLE: Pemeriksaan Login Eksternal
          LABEL: Seumur Hidup Maksimum dalam hitungan jam
          MULTI_FACTOR_CHECK:
            DESCRIPTION: Pengguna Anda harus memvalidasi ulang Multifaktor mereka pada periode ini.
            TITLE: Pemeriksaan Multifaktor
          MULTI_FACTOR_INIT:
            DESCRIPTION: Pengguna Anda akan diminta untuk menyiapkan faktor kedua atau Multifaktor pada periode ini, jika mereka belum melakukannya. Seumur hidup 0 menonaktifkan prompt ini.
            TITLE: Pemeriksaan Init Multifaktor
          PW_CHECK:
            DESCRIPTION: Pengguna akan diminta untuk mengautentikasi ulang kata sandi mereka setelah periode ini.
            TITLE: Pemeriksaan Kata Sandi
          SECOND_FACTOR_CHECK:
            DESCRIPTION: Pengguna Anda harus memvalidasi ulang faktor kedua mereka dalam periode ini.
            TITLE: Pemeriksaan Faktor Kedua
          TITLE: Masa Masuk Seumur Hidup
      LOGIN_TEXTS:
        DESCRIPTION: Sesuaikan teks formulir login Anda. Jika teks kosong, placeholder memperlihatkan nilai default. Jika Anda ingin menonaktifkan beberapa bahasa, batasi bahasa tersebut di pengaturan bahasa instance Anda.
        TITLE: Teks Antarmuka Masuk
      MESSAGE_TEXTS:
        DESCRIPTION: Sesuaikan teks email notifikasi atau pesan SMS Anda. Jika Anda ingin menonaktifkan beberapa bahasa, batasi bahasa tersebut di pengaturan bahasa instance Anda.
        TITLE: Teks Pesan
        TYPE_DESCRIPTIONS:
          DC: Saat Anda mengklaim domain untuk organisasi Anda, pengguna yang tidak menggunakan domain ini dalam nama loginnya akan diminta untuk mengubah nama loginnya agar sesuai dengan domain yang diklaim.
          INIT: Saat pengguna dibuat, mereka akan menerima email berisi tautan untuk menyetel kata sandinya.
          IU: Ketika kode undangan pengguna dibuat, mereka akan menerima email dengan tautan untuk mengatur metode otentikasi mereka.
          PC: Ketika pengguna mengubah kata sandinya, mereka akan menerima pemberitahuan tentang perubahan tersebut jika Anda telah mengaktifkannya di pengaturan pemberitahuan.
          PL: Saat pengguna menambahkan metode autentikasi Passkey, mereka harus mengaktifkannya dengan mengeklik tautan di email.
          PR: Saat pengguna menyetel ulang kata sandinya, mereka akan menerima email berisi tautan untuk menyetel kata sandi baru.
          VE: Saat pengguna mengubah alamat emailnya, mereka akan menerima email berisi tautan untuk memverifikasi alamat baru.
          VEO: Ketika pengguna menambahkan OTP melalui metode email, mereka perlu mengaktifkannya dengan memasukkan kode yang dikirimkan ke alamat email mereka.
          VP: Saat pengguna mengganti nomor teleponnya, mereka akan menerima SMS berisi kode untuk memverifikasi nomor baru.
          VSO: Ketika pengguna menambahkan OTP melalui metode SMS, mereka perlu mengaktifkannya dengan memasukkan kode yang dikirimkan ke nomor telepon mereka.
      OIDC:
        ACCESS_TOKEN:
          DESCRIPTION: Token akses digunakan untuk mengautentikasi pengguna. Ini adalah token berumur pendek yang digunakan untuk mengakses data pengguna. Gunakan masa pakai yang singkat untuk meminimalkan risiko akses tidak sah. Token akses dapat di-refresh secara otomatis menggunakan token refresh.
          TITLE: Akses Token
        DESCRIPTION: Konfigurasikan masa pakai token OIDC Anda. Gunakan masa pakai yang lebih pendek untuk meningkatkan keamanan pengguna Anda, gunakan masa pakai yang lebih lama untuk meningkatkan kenyamanan pengguna Anda.
        ID_TOKEN:
          DESCRIPTION: Token ID adalah JSON Web Token (JWT) yang berisi klaim tentang pengguna. Masa pakai token ID tidak boleh melebihi masa pakai token akses.
          TITLE: Token Identitas
        LABEL_DAYS: Seumur Hidup Maksimum dalam beberapa hari
        LABEL_HOURS: Seumur Hidup Maksimum dalam hitungan jam
        REFRESH_TOKEN:
          DESCRIPTION: Token penyegaran digunakan untuk mendapatkan token akses baru. Ini adalah token berumur panjang yang digunakan untuk menyegarkan token akses. Pengguna harus mengautentikasi ulang secara manual ketika token penyegaran kedaluwarsa.
          TITLE: Segarkan Token
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: Masa pakai token penyegaran yang menganggur adalah waktu maksimum token penyegaran tidak dapat digunakan.
          TITLE: Token Penyegaran Menganggur
        TITLE: Pengaturan Koneksi OpenID
      ORG:
        DESCRIPTION: Sesuaikan pengaturan organisasi Anda.
        TITLE: Pengaturan Organisasi
      PRIVACY_POLICY:
        DESCRIPTION: Pandu pengguna Anda ke sumber daya eksternal khusus yang ditampilkan di halaman login. Pengguna harus menerima Ketentuan Layanan dan Kebijakan Privasi sebelum mereka dapat mendaftar. Ubah tautan ke dokumentasi Anda atau setel string kosong untuk menyembunyikan tombol dokumentasi dari konsol manajemen. Tambahkan tautan eksternal khusus dan teks khusus untuk tautan tersebut di konsol manajemen, atau kosongkan untuk menyembunyikan tombol tersebut.
        TITLE: Tautan Eksternal
      PW_COMPLEXITY:
        DESCRIPTION: Pastikan pengguna Anda menggunakan kata sandi yang kuat dengan menentukan aturan kompleksitas.
        TITLE: Kompleksitas Kata Sandi
      SECRET_GENERATORS:
        DESCRIPTION: Tentukan kompleksitas dan masa hidup rahasia Anda. Kompleksitas dan masa pakai yang lebih tinggi akan meningkatkan keamanan, kompleksitas dan masa pakai yang lebih rendah akan meningkatkan kinerja dekripsi.
        TITLE: Generator Rahasia
      SECURITY:
        DESCRIPTION: Aktifkan fitur Zitadel yang dapat berdampak pada keamanan. Anda benar-benar harus mengetahui apa yang Anda lakukan sebelum mengubah pengaturan ini.
        TITLE: Pengaturan Keamanan
      SMS_PROVIDER:
        DESCRIPTION: Untuk membuka kunci semua fitur Zitadel, konfigurasikan Twilio untuk mengirim pesan SMS ke pengguna Anda.
        TITLE: Pengaturan SMS
      SMTP_PROVIDER:
        DESCRIPTION: Konfigurasikan server SMTP Anda untuk menggunakan domain untuk alamat pengirim yang diketahui dan dipercaya oleh pengguna Anda.
        TITLE: Pengaturan SMTP
      WEB_KEYS:
        CREATE:
          BITS: Bit
          CURVE: Kurva
          DESCRIPTION: Membuat kunci web baru akan menambahkannya ke daftar Anda. Zitadel secara default menggunakan kunci RSA2048 dengan fungsi hash SHA256.
          HASHER: Hasher
          KEY_TYPE: Jenis Kunci
          TITLE: Buat Kunci Web Baru
        DESCRIPTION: Kelola Kunci Web OIDC Anda untuk menandatangani dan memvalidasi token dengan aman untuk instance Zitadel Anda.
        PREVIOUS_TABLE:
          DEACTIVATED_ON: Dinonaktifkan pada
          DESCRIPTION: Ini adalah kunci web sebelumnya yang tidak lagi aktif.
          TITLE: Kunci Web Sebelumnya
        TABLE:
          ACTIVATE: Aktifkan Kunci Web Berikutnya
          ACTIVE: Saat ini aktif
          DESCRIPTION: Kunci web Anda yang aktif dan akan datang. Mengaktifkan kunci baru akan menonaktifkan kunci yang sedang digunakan.
          FUTURE: Mendatang
          NEXT: Berikutnya dalam antrean
