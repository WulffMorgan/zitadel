        TYPES:
          restAsync: REST Assíncrono
          restCall: Chamada REST
          restWebhook: REST Webhook
        TYPES_DESCRIPTION: |-
          Webhook, a chamada lida com o código de status, mas a resposta é irrelevante
          Call, a chamada lida com o código de status e a resposta
          Async, a chamada não lida nem com o código de status nem com a resposta, mas pode ser chamada em paralelo com outros alvos
