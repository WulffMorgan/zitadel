          JSON: Payload JSON padrão com um cabeçalho de assinatura para verificação.
          JWT: O payload é enviado como um JWT assinado. A verificação é feita pela assinatura do JWT.
          JWE: O JWT é adicionalmente cifrado para evitar acesso não autorizado às informações do payload.
        TIMEOUT: Tempo Limite
        TIMEOUT_DESCRIPTION: Defina o tempo máximo que seu destino tem para responder. Se demorar mais, interromperemos a solicitação.
        TITLE: Criar seu Destino
