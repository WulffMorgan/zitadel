    EXECUTION:
      DESCRIPTION: تتيح لك الإجراءات تشغيل كود مخصص استجابةً لطلبات API أو الأحداث أو وظائف محددة. استخدمها لتوسيع وظائف Zitadel، وأتمتة سير العمل، والتكامل مع الأنظمة الأخرى.
      DIALOG:
        CONDITION:
          ALL:
            DESCRIPTION: حدد هذا الخيار إذا كنت تريد تشغيل الإجراء الخاص بك عند كل طلب
            TITLE: الكل
          ALL_EVENTS: حدد هذا الخيار إذا كنت تريد تشغيل الإجراء الخاص بك عند كل حدث
          FUNCTIONNAME:
            DESCRIPTION: اختر الوظيفة التي تريد تنفيذها
            TITLE: اسم الوظيفة
          REQ_RESP_DESCRIPTION: اختر ما إذا كان هذا الإجراء ينطبق على جميع الطلبات، أو خدمة معينة (مثل إدارة المستخدمين)، أو طلب واحد (مثل إنشاء مستخدم).
          SELECT_EVENT:
            DESCRIPTION: إذا كنت تريد التنفيذ فقط عند حدث محدد، حدده هنا
            TITLE: تحديد الحدث
          SELECT_GROUP:
            DESCRIPTION: إذا كنت تريد التنفيذ فقط عند مجموعة من الأحداث، فقم بتعيين المجموعة هنا
            TITLE: تعيين المجموعة
          SELECT_METHOD:
            DESCRIPTION: إذا كنت تريد التنفيذ فقط عند طلب محدد، حدده هنا
            NOTE: إذا لم تحدد طريقة، فسيتم تشغيل الإجراء الخاص بك عند كل طلب في الخدمة المحددة.
            TITLE: تحديد الطريقة
          SELECT_SERVICE:
            DESCRIPTION: اختر خدمة Zitadel للإجراء الخاص بك.
            TITLE: تحديد الخدمة
        CREATE_TITLE: إنشاء إجراء
        TARGET:
          CONDITIONS:
            DESCRIPTION: شروط التنفيذ
          DESCRIPTION: يمكنك اختيار تنفيذ هدف، أو تشغيله بناءً على نفس شروط الأهداف الأخرى.
          TARGET:
            DESCRIPTION: الهدف الذي تريد تنفيذه لهذا الإجراء
        TYPE:
          DESCRIPTION: حدد متى تريد تشغيل هذا الإجراء
          EVENTS:
            DESCRIPTION: الأحداث التي تقع داخل Zitadel. قد يكون هذا أي شيء مثل قيام مستخدم بإنشاء حساب، أو تسجيل دخول ناجح، وما إلى ذلك.
            TITLE: أحداث
          FUNCTIONS:
            DESCRIPTION: الوظائف التي يمكنك استدعاؤها داخل Zitadel. قد يكون هذا أي شيء من إرسال بريد إلكتروني إلى إنشاء مستخدم.
            TITLE: وظائف
          REQUEST:
            DESCRIPTION: الطلبات التي تحدث داخل Zitadel. قد يكون هذا شيئاً مثل استدعاء طلب تسجيل الدخول.
            TITLE: طلب
          RESPONSE:
            DESCRIPTION: استجابة لطلب داخل Zitadel. فكر في الاستجابة التي تتلقاها عند جلب مستخدم.
            TITLE: استجابة
