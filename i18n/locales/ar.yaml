      DESCRIPTION: شغل كود مخصص عند الأحداث التي تقع أثناء مصادقة المستخدمين في ZITADEL. قم بأتمتة عملياتك، وإثراء البيانات الوصفية للمستخدمين ورموزهم، أو إخطار الأنظمة الخارجية.
