          FUTURE: المستقبل
          NEXT: التالي في قائمة الانتظار
          NOTE: 'ملاحظة: نقطة نهاية JWKs OIDC تعيد استجابة قابلة للتخزين المؤقت (افتراضياً 5 دقائق). تجنب تفعيل مفتاح قريباً جداً، حيث قد لا يكون متاحاً للتخزين المؤقت والتطبيقات بعد.'
