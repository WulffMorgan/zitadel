          TITLE: أعمار تسجيل الدخول
      LOGIN_TEXTS:
        DESCRIPTION: تخصيص نصوص نموذج تسجيل الدخول. إذا كان النص فارغاً، يظهر العنصر النائب القيمة الافتراضية. إذا كنت تريد تعطيل بعض اللغات، اسحبها إلى قسم اللغات غير المسموح بها في إعدادات لغة المثيل.
        TITLE__MISSING: Login Interface Texts
      MESSAGE_TEXTS:
        DESCRIPTION: تخصيص نصوص رسائل البريد الإلكتروني أو الرسائل القصيرة للإشعار. إذا كنت تريد تعطيل بعض اللغات، اسحبها إلى قسم اللغات غير المسموح بها في إعدادات لغة المثيل.
        TITLE__MISSING: Message Texts
        TYPE_DESCRIPTIONS:
          DC: عندما تطالب بنطاق لمنظمتك، سيتم مطالبة المستخدمين الذين لا يستخدمون هذا النطاق في اسم تسجيل الدخول بتغيير اسم تسجيل الدخول الخاص بهم ليتناسب مع النطاق المطالب به.
          INIT: عند إنشاء مستخدم، سيتلقى بريداً إلكترونياً برابط لتعيين كلمة المرور الخاصة به.
          IU: عندما يتم إنشاء رمز دعوة المستخدم، سيتلقى بريداً إلكترونياً برابط لتعيين طريقة المصادقة الخاصة به.
          PC: عندما يغير المستخدم كلمة المرور الخاصة به، سيتلقى إشعاراً بالتغيير إذا قمت بتمكين هذا في إعدادات الإشعارات.
          PL: عندما يضيف المستخدم طريقة مصادقة بدون كلمة مرور، يحتاج إلى تفعيلها بالنقر على رابط في البريد الإلكتروني.
          PR: عندما يعيد المستخدم تعيين كلمة المرور الخاصة به، سيتلقى بريداً إلكترونياً برابط لتعيين كلمة مرور جديدة.
          VE: عندما يغير المستخدم عنوان بريده الإلكتروني، سيتلقى بريداً إلكترونياً برابط للتحقق من العنوان الجديد.
          VEO: عندما يضيف المستخدم OTP عبر البريد الإلكتروني، يحتاج إلى تفعيلها بإدخال الرمز المرسل إلى بريده الإلكتروني.
          VP: عندما يغير المستخدم رقم هاتفه، سيتلقى رسالة نصية قصيرة برمز للتحقق من الرقم الجديد.
          VSO: عندما يضيف المستخدم OTP عبر الرسائل القصيرة، يحتاج إلى تفعيلها بإدخال الرمز المرسل إلى رقم هاتفه.
      OIDC:
        ACCESS_TOKEN:
          DESCRIPTION: يستخدم رمز الوصول لمصادقة المستخدم. هو رمز قصير العمر يستخدم للوصول إلى بيانات المستخدم. استخدم عمراً قصيراً لتقليل مخاطر الوصول غير المصرح به. يمكن تحديث رموز الوصول تلقائياً باستخدام رمز التحديث.
          TITLE: رمز الوصول
        DESCRIPTION: تكوين عمر رموز OIDC. استخدم أعماراً أقصر لزيادة أمان المستخدمين، واستخدم أعماراً أطول لزيادة راحة المستخدمين.
        ID_TOKEN:
          DESCRIPTION: رمز ID هو رمز JSON Web Token (JWT) يحتوي على مطالبات حول المستخدم. يجب ألا يتجاوز عمر رمز ID عمر رمز الوصول.
          TITLE__MISSING: ID Token
        LABEL_DAYS: الحد الأقصى للعمر بالأيام
        LABEL_HOURS: الحد الأقصى للعمر بالساعات
        REFRESH_TOKEN:
          DESCRIPTION: يستخدم رمز التحديث للحصول على رمز وصول جديد. هو رمز طويل العمر يستخدم لتحديث رمز الوصول. يجب على المستخدم إعادة المصادقة يدوياً عند انتهاء صلاحية رمز التحديث.
          TITLE__MISSING: Refresh Token
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: عمر رمز التحديث الخامل هو الحد الأقصى للوقت الذي يمكن أن يكون فيه رمز التحديث غير مستخدم.
          TITLE: رمز التحديث الخامل
        TITLE: إعدادات OpenID Connect
      ORG:
        DESCRIPTION: تخصيص إعدادات المنظمة الخاصة بك.
        TITLE: إعدادات المنظمة
      PRIVACY_POLICY:
        DESCRIPTION: توجيه المستخدمين إلى موارد خارجية مخصصة تظهر في صفحة تسجيل الدخول. يحتاج المستخدمون إلى قبول شروط الخدمة وسياسة الخصوصية قبل أن يتمكنوا من التسجيل. غيّر الرابط إلى وثائقك أو عيّن سلسلة فارغة لإخفاء زر التوثيق من وحدة التحكم. أضف رابطاً خارجياً مخصصاً ونصاً مخصصاً لهذا الرابط في وحدة التحكم، أو اجعلهما فارغين لإخفاء هذا الزر.
        TITLE__MISSING: External Links
      PW_COMPLEXITY:
        DESCRIPTION: تأكد من استخدام المستخدمين لكلمات مرور قوية من خلال تحديد قواعد التعقيد.
        TITLE__MISSING: Password Complexity
      SECRET_GENERATORS:
        DESCRIPTION: حدد تعقيدات الأسرار وأعمارها. تعقيد وعمر أعلى يحسن الأمان، وتعقيد وعمر أقل يحسن أداء فك التشفير.
        TITLE__MISSING: Secret Generators
      SECURITY:
        DESCRIPTION: تمكين ميزات ZITADEL التي يمكن أن يكون لها تأثيرات أمنية. يجب أن تعرف حقاً ما تفعله قبل تغيير هذه الإعدادات.
        TITLE__MISSING: Security Settings
      SMS_PROVIDER:
        DESCRIPTION: لفتح جميع ميزات ZITADEL، قم بتكوين Twilio لإرسال رسائل SMS للمستخدمين.
        TITLE: إعدادات الرسائل القصيرة (SMS)
      SMTP_PROVIDER:
        DESCRIPTION: تكوين خادم SMTP الخاص بك لاستخدام نطاق لعنوان المرسل يعرفه المستخدمون ويثقون به.
        TITLE__CONFLICT: إعداد SMTP | إعداد إعدادات SMTP الخاصة بك | إعدادات SMTP
      WEB_KEYS:
        CREATE:
          BITS: بت
          CURVE: منحنى
          DESCRIPTION: إضافة مفتاح ويب جديد إلى القائمة. يستخدم ZITADEL مفاتيح RSA2048 مع تجزئة SHA256 افتراضياً.
          HASHER: تجزئة
          KEY_TYPE: نوع المفتاح
          TITLE: إنشاء مفتاح ويب جديد
