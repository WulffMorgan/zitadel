        TITLE__MISSING: Your next steps
      TITLE__MISSING: Get started with Zitadel
    METADATA_TITLE__MISSING: Metadata
    ORG:
      DESCRIPTION: تستضيف المنظمة المستخدمين، والمشاريع ذات التطبيقات، ومزودي الهوية، والإعدادات مثل العلامة التجارية للشركة. هل تريد مشاركة الإعدادات عبر منظمات متعددة؟ قم بتكوين الإعدادات الافتراضية.
      METADATA: أضف سمات مخصصة للمنظمة مثل موقعها أو معرف في نظام آخر. يمكنك استخدام هذه المعلومات في إجراءاتك.
      TITLE__MISSING: Organization
    PROJECTS:
      DESCRIPTION: 'يستضيف المشروع تطبيقاً واحداً أو أكثر يمكنك استخدامه لمصادقة المستخدمين لديك. على سبيل المثال، قد يكون لديك مشروع واحد يضم 3 تطبيقات: واحد لواجهة الويب، وواحد لتطبيق الهاتف المحمول، وواحد لخدمات الخلفية. كما يمكنك تفويض المستخدمين لديك بالمشاريع. للسماح للمستخدمين من منظمات أخرى بتسجيل الدخول إلى تطبيقاتك، امنحهم حق الوصول إلى مشروعك.<br/><br/>إذا لم تتمكن من العثور على مشروع، اتصل بمالك المشروع أو شخص لديه الحقوق المقابلة للحصول على الوصول.'
      GRANTED:
        DESCRIPTION: هذه هي المشاريع التي منحتها منظمات أخرى لك. باستخدام المشاريع الممنوحة، يمكنك منح المستخدمين لديك حق الوصول إلى تطبيقات المنظمات الأخرى.
        TITLE__MISSING: Granted Projects
      OWNED:
        DESCRIPTION: هذه هي المشاريع التي تمتلكها. يمكنك إدارة إعدادات هذه المشاريع وتعيينات الأدوار والتطبيقات.
        TITLE__MISSING: Owned Projects
      TITLE__CONFLICT: المشاريع | المشروع | مشروع
    ROLE_ASSIGNMENTS:
      DESCRIPTION: تحدد تعيينات الأدوار حقوق وصول المستخدم إلى المشروع. يمكنك منح المستخدم حق الوصول إلى مشروع وتحديد أدوار المستخدمين داخل هذا المشروع.
      TITLE__MISSING: Role Assignments
    SETTINGS:
      BRANDING:
        DESCRIPTION: تخصيص شكل ومظهر نموذج تسجيل الدخول. تذكر تطبيق التكوين عند الانتهاء.
        TITLE__MISSING: Branding
      DOMAINS:
        DESCRIPTION: تحديد القيود على نطاقاتك وتكوين أنماط اسم تسجيل الدخول.
        DOMAIN_VERIFICATION:
          DESCRIPTION: السماح لمنظمتك فقط باستخدام النطاقات التي تتحكم فيها بالفعل. إذا تم تفعيل هذا، يتم التحقق من نطاقات المنظمة بشكل دوري عن طريق تحدي DNS أو HTTP قبل استخدامها. هذه ميزة أمان لمنع اختطاف النطاق.
          TITLE__MISSING: Domain Verification
        LOGIN_NAME_PATTERN:
          DESCRIPTION: التحكم في نمط أسماء دخول المستخدمين. يختار ZITADEL منظمة المستخدمين بمجرد إدخال اسم الدخول. لذلك، يجب أن تكون أسماء الدخول فريدة عبر جميع المنظمات. إذا كان لديك مستخدمون لديهم حساب في نطاقات متعددة، يمكنك ضمان التفرد عن طريق إضافة لاحقة اسم الدخول بنطاق المنظمة.
          TITLE: نمط اسم الدخول
        REQUIRE_VERIFICATION:
          DESCRIPTION: إذا تم تفعيل هذا، يجب التحقق من نطاقات المنظمة قبل استخدامها لاكتشاف النطاق أو إضافة لاحقة اسم المستخدم.
          TITLE: تطلب التحقق من النطاقات المخصصة
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: السماح بعنوان مرسل SMTP فقط إذا كان يطابق أحد نطاقات المثيل الخاص بك.
          TITLE: عنوان مرسل SMTP
        TITLE__MISSING: Domain Settings
      FEATURES:
        DESCRIPTION: فتح الميزات للمثيل الخاص بك.
        TITLE: إعدادات الميزات
      IAM_EVENTS:
        DESCRIPTION: تعرض هذه الصفحة جميع تغييرات الحالة في المثيل الخاص بك بقدر حد تتبع التدقيق للمثيل. قم بتصفية القائمة حسب النطاق الزمني لأغراض التصحيح أو تصفيتها حسب تجميع لأغراض التدقيق.
        TITLE__MISSING: Events
      IAM_FAILED_EVENTS:
        DESCRIPTION: تعرض هذه الصفحة جميع الأحداث الفاشلة في المثيل الخاص بك. إذا لم يعمل ZITADEL كما تتوقع، تحقق دائماً من هذه القائمة أولاً.
        TITLE__MISSING: Failed Events
      IAM_VIEWS:
        DESCRIPTION: تعرض هذه الصفحة جميع مشاهدات قاعدة البيانات ومتى عالجت آخر حدث لها. إذا فقدت بعض البيانات، تحقق مما إذا كانت المشاهدة محدثة.
        TITLE__MISSING: Views
      IDPS:
        ACTIVATE:
          DESCRIPTION: IdP الخاص بك ليس نشطاً بعد. قم بتفعيله للسماح للمستخدمين بتسجيل الدخول.
          TITLE: تفعيل IdP
        AUTOFILL:
          DESCRIPTION: استخدم إجراء لتحسين تجربة المستخدمين. يمكنك ملء نموذج تسجيل ZITADEL مسبقاً بالقيم من مزود الهوية.
          TITLE: التعبئة التلقائية لبيانات المستخدم
        CALLBACK:
          DESCRIPTION: قبل أن تتمكن من تكوين ZITADEL، مرر هذا الرابط لمزود الهوية لتمكين إعادة التوجيه.
          TITLE: تكوين مزود الهوية {{ provider }} الخاص بك
        DESCRIPTION: إنشاء وتفعيل مزودي الهوية الخارجيين. اختر مزوداً معروفاً أو قم بتكوين أي مزود OIDC أو OAuth أو SAML آخر من اختيارك. يمكنك حتى استخدام رموز JWT الحالية كهويات موحدة عن طريق تكوين مزود هوية JWT.
        JWT:
          DESCRIPTION: تتيح لك ميزة مزود هوية JWT استخدام رموز JWT الحالية كهويات موحدة. هذه الميزة مفيدة إذا كان لديك بالفعل مُصدر لرموز JWT. باستخدام مزود هوية JWT، يمكنك استخدام هذه الرموز لإنشاء وتحديث المستخدمين في ZITADEL أثناء التنقل.
          TITLE: استخدام JWTs كهويات موحدة
        LDAP:
          DESCRIPTION: وفر تفاصيل الاتصال بخادم LDAP وتكوين تعيين سمات LDAP إلى سمات ZITADEL.
          TITLE: تكوين ZITADEL للاتصال بمزود هوية LDAP الخاص بك
        NEXT: ماذا الآن؟
        SAML:
          DESCRIPTION: تم تكوين ZITADEL. الآن يحتاج مزود هوية SAML الخاص بك لبعض التكوين. تسمح معظم المزودين بتحميل ملف بيانات ZITADEL XML بالكامل. تطلب مزودات أخرى منك توفير بعض عناوين URL المحددة فقط، مثل معرف الكيان (عنوان URL للبيانات الوصفية)، أو عنوان URL لخدمة استهلاك التأكيد (ACS)، أو عنوان URL لتسجيل الخروج الفردي.
          TITLE: تكوين مزود هوية SAML الخاص بك
        TITLE__MISSING: Identity Providers
      INSTANCE:
        DESCRIPTION: الإعدادات الافتراضية لجميع المنظمات. مع الأذونات الصحيحة، بعضها قابل للتجاوز في إعدادات المنظمة.
        TITLE__MISSING: Instance Settings
      LANGUAGES:
        DESCRIPTION: تقييد اللغات التي يتم ترجمة نموذج تسجيل الدخول ورسائل الإشعار إليها. إذا كنت تريد تعطيل بعض اللغات، اسحبها إلى قسم اللغات غير المسموح بها. يمكنك تحديد لغة مسموح بها كلغة افتراضية. إذا كانت لغة المستخدم المفضلة غير مسموح بها، يتم استخدام اللغة الافتراضية.
        TITLE__MISSING: Languages
      LOGIN:
        FORM:
          DESCRIPTION: تخصيص نموذج تسجيل الدخول.
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: إذا تم تفعيل هذا، لا يمكن للمستخدمين استخدام عناوين بريدهم الإلكتروني لتسجيل الدخول. احذر أنه إذا قمت بتعطيل هذا، يجب أن تكون عناوين البريد الإلكتروني للمستخدمين فريدة عبر جميع المنظمات لتسجيل الدخول.
            TITLE: تعطيل تسجيل الدخول بالبريد الإلكتروني
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: إذا تم تفعيل هذا، لا يمكن للمستخدمين استخدام أرقام هواتفهم لتسجيل الدخول. احذر أنه إذا قمت بتعطيل هذا، يجب أن تكون أرقام هواتف المستخدمين فريدة عبر جميع المنظمات لتسجيل الدخول.
            TITLE: تعطيل تسجيل الدخول بالهاتف
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: العثور على منظمات المستخدمين اعتماداً على نطاق أسماء تسجيل دخولهم، على سبيل المثال عنوان بريدهم الإلكتروني.
            TITLE: مسموح باكتشاف النطاق
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: السماح للمستخدمين بتسجيل الدخول باستخدام مزود هوية خارجي بدلاً من استخدام مستخدم ZITADEL لتسجيل الدخول.
            TITLE: مسموح بتسجيل الدخول الخارجي
          HIDE_PASSWORD_RESET:
            DESCRIPTION: عدم السماح للمستخدمين بإعادة تعيين كلمة المرور الخاصة بهم.
            TITLE: إخفاء إعادة تعيين كلمة المرور
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: إذا تم تفعيل هذا، لن يظهر نموذج تسجيل الدخول رسالة خطأ إذا كان اسم المستخدم غير معروف. هذا يساعد على منع تخمين اسم المستخدم.
            TITLE: تجاهل أسماء المستخدمين غير المعروفة
          LOCAL_AUTHENTICATION_ALLOWED__MISSING:
            DESCRIPTION__MISSING: Allow your users to log in with their username and password or passkey authentication. If this is deactivated, your users can only log in using an external identity provider.
            TITLE__MISSING: Local authentication allowed
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: السماح للمستخدمين المجهولين بإنشاء منظمة.
            TITLE: مسموح بتسجيل المنظمة
          TITLE: نموذج تسجيل الدخول
          USERNAME_PASSWORD_ALLOWED__EXTRA:
