  DESCRIPTIONS:
    ACTIONS:
      ACTIONSTWO_NOTE: Actions V2 نسخة جديدة ومحسنة من الإجراءات متاحة الآن. النسخة الحالية لا تزال متاحة، لكن تطويرنا المستقبلي سيركز على النسخة الجديدة، التي ستحل محل النسخة الحالية في النهاية.
      DESCRIPTION: شغل كود مخصص عند الأحداث التي تقع أثناء مصادقة المستخدمين في ZITADEL. قم بأتمتة عملياتك، وإثراء البيانات الوصفية للمستخدمين ورموزهم، أو إخطار الأنظمة الخارجية.
      FLOWS:
        DESCRIPTION: اختر تدفق مصادقة وشغل إجراءك عند حدث معين داخل هذا التدفق.
        TITLE: التدفقات
      SCRIPTS:
        DESCRIPTION: اكتب كود JavaScript الخاص بك مرة واحدة وقم بتشغيله في تدفقات متعددة.
        TITLE: السكربتات
      TITLE: الإجراءات
    HOME:
      MORE_SHORTCUTS:
        DOCS:
          DESCRIPTION: استكشف قاعدة معرفة ZITADEL للتعرف على المفاهيم والأفكار الأساسية. تعلم كيف يعمل ZITADEL وكيفية استخدامه.
          TITLE: الوثائق
        EXAMPLES:
          DESCRIPTION: تصفح أمثلتنا و SDKs لاستخدام ZITADEL جنباً إلى جنب مع لغات البرمجة والأدوات المفضلة لديك.
          TITLE: أمثلة ومجموعات تطوير البرمجيات (SDKs)
        GET_STARTED:
          DESCRIPTION: اتبع دليل البدء السريع خطوة بخطوة وابدأ البناء فوراً.
          TITLE: البدء
      NEXT:
        CREATE_PROJECT:
          DESCRIPTION: أضف مشروعًا وحدد أدواره وتوزيع الأدوار.
          TITLE: إنشاء مشروع
        DESCRIPTION: أكمل الخطوات التالية لتأمين تطبيقك.
        TITLE: خطواتك التالية
      TITLE: ابدأ مع ZITADEL
    METADATA_TITLE: البيانات الوصفية
    ORG:
      DESCRIPTION: تستضيف المنظمة المستخدمين، والمشاريع ذات التطبيقات، ومزودي الهوية، والإعدادات مثل العلامة التجارية للشركة. هل تريد مشاركة الإعدادات عبر منظمات متعددة؟ قم بتكوين الإعدادات الافتراضية.
      METADATA: أضف سمات مخصصة للمنظمة مثل موقعها أو معرف في نظام آخر. يمكنك استخدام هذه المعلومات في إجراءاتك.
      TITLE: المنظمة
    PROJECTS:
      DESCRIPTION: 'يستضيف المشروع تطبيقاً واحداً أو أكثر يمكنك استخدامه لمصادقة المستخدمين لديك. على سبيل المثال، قد يكون لديك مشروع واحد يضم 3 تطبيقات: واحد لواجهة الويب، وواحد لتطبيق الهاتف المحمول، وواحد لخدمات الخلفية. كما يمكنك تفويض المستخدمين لديك بالمشاريع. للسماح للمستخدمين من منظمات أخرى بتسجيل الدخول إلى تطبيقاتك، امنحهم حق الوصول إلى مشروعك.<br/><br/>إذا لم تتمكن من العثور على مشروع، اتصل بمالك المشروع أو شخص لديه الحقوق المقابلة للحصول على الوصول.'
      GRANTED:
        DESCRIPTION: هذه هي المشاريع التي منحتها منظمات أخرى لك. باستخدام المشاريع الممنوحة، يمكنك منح المستخدمين لديك حق الوصول إلى تطبيقات المنظمات الأخرى.
        TITLE: المشاريع الممنوحة
      OWNED:
        DESCRIPTION: هذه هي المشاريع التي تمتلكها. يمكنك إدارة إعدادات هذه المشاريع وتعيينات الأدوار والتطبيقات.
        TITLE: المشاريع المملوكة
      TITLE: المشاريع
    ROLE_ASSIGNMENTS:
      DESCRIPTION: تحدد تعيينات الأدوار حقوق وصول المستخدم إلى المشروع. يمكنك منح المستخدم حق الوصول إلى مشروع وتحديد أدوار المستخدمين داخل هذا المشروع.
      TITLE: تعيينات الأدوار
    SETTINGS:
      BRANDING:
        DESCRIPTION: تخصيص شكل ومظهر نموذج تسجيل الدخول. تذكر تطبيق التكوين عند الانتهاء.
        TITLE: العلامة التجارية
      DOMAINS:
        DESCRIPTION: تحديد القيود على نطاقاتك وتكوين أنماط اسم تسجيل الدخول.
        DOMAIN_VERIFICATION:
          DESCRIPTION: السماح لمنظمتك فقط باستخدام النطاقات التي تتحكم فيها بالفعل. إذا تم تفعيل هذا، يتم التحقق من نطاقات المنظمة بشكل دوري عن طريق تحدي DNS أو HTTP قبل استخدامها. هذه ميزة أمان لمنع اختطاف النطاق.
          TITLE: التحقق من النطاق
        LOGIN_NAME_PATTERN:
          DESCRIPTION: التحكم في نمط أسماء دخول المستخدمين. يختار ZITADEL منظمة المستخدمين بمجرد إدخال اسم الدخول. لذلك، يجب أن تكون أسماء الدخول فريدة عبر جميع المنظمات. إذا كان لديك مستخدمون لديهم حساب في نطاقات متعددة، يمكنك ضمان التفرد عن طريق إضافة لاحقة اسم الدخول بنطاق المنظمة.
          TITLE: نمط اسم الدخول
        REQUIRE_VERIFICATION:
          DESCRIPTION: إذا تم تفعيل هذا، يجب التحقق من نطاقات المنظمة قبل استخدامها لاكتشاف النطاق أو إضافة لاحقة اسم المستخدم.
          TITLE: تطلب التحقق من النطاقات المخصصة
        SMTP_SENDER_ADDRESS:
          DESCRIPTION: السماح بعنوان مرسل SMTP فقط إذا كان يطابق أحد نطاقات المثيل الخاص بك.
          TITLE: عنوان مرسل SMTP
        TITLE: إعدادات النطاق
      FEATURES:
        DESCRIPTION: فتح الميزات للمثيل الخاص بك.
        TITLE: إعدادات الميزات
      IAM_EVENTS:
        DESCRIPTION: تعرض هذه الصفحة جميع تغييرات الحالة في المثيل الخاص بك بقدر حد تتبع التدقيق للمثيل. قم بتصفية القائمة حسب النطاق الزمني لأغراض التصحيح أو تصفيتها حسب تجميع لأغراض التدقيق.
        TITLE: الأحداث
      IAM_FAILED_EVENTS:
        DESCRIPTION: تعرض هذه الصفحة جميع الأحداث الفاشلة في المثيل الخاص بك. إذا لم يعمل ZITADEL كما تتوقع، تحقق دائماً من هذه القائمة أولاً.
        TITLE: الأحداث الفاشلة
      IAM_VIEWS:
        DESCRIPTION: تعرض هذه الصفحة جميع مشاهدات قاعدة البيانات ومتى عالجت آخر حدث لها. إذا فقدت بعض البيانات، تحقق مما إذا كانت المشاهدة محدثة.
        TITLE: المشاهدات
      IDPS:
        ACTIVATE:
          DESCRIPTION: IdP الخاص بك ليس نشطاً بعد. قم بتفعيله للسماح للمستخدمين بتسجيل الدخول.
          TITLE: تفعيل IdP
        AUTOFILL:
          DESCRIPTION: استخدم إجراء لتحسين تجربة المستخدمين. يمكنك ملء نموذج تسجيل ZITADEL مسبقاً بالقيم من مزود الهوية.
          TITLE: التعبئة التلقائية لبيانات المستخدم
        CALLBACK:
          DESCRIPTION: قبل أن تتمكن من تكوين ZITADEL، مرر هذا الرابط لمزود الهوية لتمكين إعادة التوجيه.
          TITLE: تكوين مزود الهوية {{ provider }} الخاص بك
        DESCRIPTION: إنشاء وتفعيل مزودي الهوية الخارجيين. اختر مزوداً معروفاً أو قم بتكوين أي مزود OIDC أو OAuth أو SAML آخر من اختيارك. يمكنك حتى استخدام رموز JWT الحالية كهويات موحدة عن طريق تكوين مزود هوية JWT.
        JWT:
          DESCRIPTION: تتيح لك ميزة مزود هوية JWT استخدام رموز JWT الحالية كهويات موحدة. هذه الميزة مفيدة إذا كان لديك بالفعل مُصدر لرموز JWT. باستخدام مزود هوية JWT، يمكنك استخدام هذه الرموز لإنشاء وتحديث المستخدمين في ZITADEL أثناء التنقل.
          TITLE: استخدام JWTs كهويات موحدة
        LDAP:
          DESCRIPTION: وفر تفاصيل الاتصال بخادم LDAP وتكوين تعيين سمات LDAP إلى سمات ZITADEL.
          TITLE: تكوين ZITADEL للاتصال بمزود هوية LDAP الخاص بك
        NEXT: ماذا الآن؟
        SAML:
          DESCRIPTION: تم تكوين ZITADEL. الآن يحتاج مزود هوية SAML الخاص بك لبعض التكوين. تسمح معظم المزودين بتحميل ملف بيانات ZITADEL XML بالكامل. تطلب مزودات أخرى منك توفير بعض عناوين URL المحددة فقط، مثل معرف الكيان (عنوان URL للبيانات الوصفية)، أو عنوان URL لخدمة استهلاك التأكيد (ACS)، أو عنوان URL لتسجيل الخروج الفردي.
          TITLE: تكوين مزود هوية SAML الخاص بك
        TITLE: مزودو الهوية
      INSTANCE:
        DESCRIPTION: الإعدادات الافتراضية لجميع المنظمات. مع الأذونات الصحيحة، بعضها قابل للتجاوز في إعدادات المنظمة.
        TITLE: إعدادات المثيل
      LANGUAGES:
        DESCRIPTION: تقييد اللغات التي يتم ترجمة نموذج تسجيل الدخول ورسائل الإشعار إليها. إذا كنت تريد تعطيل بعض اللغات، اسحبها إلى قسم اللغات غير المسموح بها. يمكنك تحديد لغة مسموح بها كلغة افتراضية. إذا كانت لغة المستخدم المفضلة غير مسموح بها، يتم استخدام اللغة الافتراضية.
        TITLE: اللغات
      LOGIN:
        FORM:
          DESCRIPTION: تخصيص نموذج تسجيل الدخول.
          DISABLE_EMAIL_LOGIN:
            DESCRIPTION: إذا تم تفعيل هذا، لا يمكن للمستخدمين استخدام عناوين بريدهم الإلكتروني لتسجيل الدخول. احذر أنه إذا قمت بتعطيل هذا، يجب أن تكون عناوين البريد الإلكتروني للمستخدمين فريدة عبر جميع المنظمات لتسجيل الدخول.
            TITLE: تعطيل تسجيل الدخول بالبريد الإلكتروني
          DISABLE_PHONE_LOGIN:
            DESCRIPTION: إذا تم تفعيل هذا، لا يمكن للمستخدمين استخدام أرقام هواتفهم لتسجيل الدخول. احذر أنه إذا قمت بتعطيل هذا، يجب أن تكون أرقام هواتف المستخدمين فريدة عبر جميع المنظمات لتسجيل الدخول.
            TITLE: تعطيل تسجيل الدخول بالهاتف
          DOMAIN_DISCOVERY_ALLOWED:
            DESCRIPTION: العثور على منظمات المستخدمين اعتماداً على نطاق أسماء تسجيل دخولهم، على سبيل المثال عنوان بريدهم الإلكتروني.
            TITLE: مسموح باكتشاف النطاق
          EXTERNAL_LOGIN_ALLOWED:
            DESCRIPTION: السماح للمستخدمين بتسجيل الدخول باستخدام مزود هوية خارجي بدلاً من استخدام مستخدم ZITADEL لتسجيل الدخول.
            TITLE: مسموح بتسجيل الدخول الخارجي
          HIDE_PASSWORD_RESET:
            DESCRIPTION: عدم السماح للمستخدمين بإعادة تعيين كلمة المرور الخاصة بهم.
            TITLE: إخفاء إعادة تعيين كلمة المرور
          IGNORE_UNKNOWN_USERNAMES:
            DESCRIPTION: إذا تم تفعيل هذا، لن يظهر نموذج تسجيل الدخول رسالة خطأ إذا كان اسم المستخدم غير معروف. هذا يساعد على منع تخمين اسم المستخدم.
            TITLE: تجاهل أسماء المستخدمين غير المعروفة
          LOCAL_AUTHENTICATION_ALLOWED__MISSING:
            DESCRIPTION__MISSING: null
            TITLE__MISSING: null
          ORG_REGISTRATION_ALLOWED:
            DESCRIPTION: السماح للمستخدمين المجهولين بإنشاء منظمة.
            TITLE: مسموح بتسجيل المنظمة
          TITLE: نموذج تسجيل الدخول
          USERNAME_PASSWORD_ALLOWED__EXTRA:
            DESCRIPTION: السماح للمستخدمين بتسجيل الدخول باستخدام اسم المستخدم وكلمة المرور. إذا تم تعطيل هذا، يمكن للمستخدمين تسجيل الدخول فقط باستخدام المصادقة بدون كلمة مرور أو باستخدام مزود هوية خارجي.
            TITLE: مسموح باسم المستخدم وكلمة المرور
          USER_REGISTRATION_ALLOWED:
            DESCRIPTION: السماح للمستخدمين المجهولين بإنشاء حساب.
            TITLE: مسموح بتسجيل المستخدم
        LIFETIMES:
          DESCRIPTION: تعزيز أمانك عن طريق تقليل بعض الأعمار القصوى المتعلقة بتسجيل الدخول.
          EXT_LOGIN_CHECK:
            DESCRIPTION: تتم إعادة توجيه المستخدمين إلى مزودي الهوية الخارجيين بعد هذه الفترات.
            TITLE: فحص تسجيل الدخول الخارجي
          LABEL: الحد الأقصى للعمر بالساعات
          MULTI_FACTOR_CHECK:
            DESCRIPTION: يجب على المستخدمين إعادة التحقق من متعدد العوامل في هذه الفترات.
            TITLE: فحص متعدد العوامل
          MULTI_FACTOR_INIT:
            DESCRIPTION: سيُطلب من المستخدمين إعداد عامل ثانٍ أو متعدد العوامل بعد هذه الفترات إذا لم يفعلوا ذلك بالفعل. مدة حياة 0 تعطل هذا الطلب.
            TITLE: فحص تهيئة متعدد العوامل
          PW_CHECK:
            DESCRIPTION: سيُطلب من المستخدمين إعادة المصادقة بكلمة المرور الخاصة بهم بعد هذه الفترة.
            TITLE: فحص كلمة المرور
          SECOND_FACTOR_CHECK:
            DESCRIPTION: يجب على المستخدمين إعادة التحقق من عاملهم الثاني في هذه الفترات.
            TITLE: فحص العامل الثاني
          TITLE: أعمار تسجيل الدخول
      LOGIN_TEXTS:
        DESCRIPTION: تخصيص نصوص نموذج تسجيل الدخول. إذا كان النص فارغاً، يظهر العنصر النائب القيمة الافتراضية. إذا كنت تريد تعطيل بعض اللغات، اسحبها إلى قسم اللغات غير المسموح بها في إعدادات لغة المثيل.
        TITLE: نصوص واجهة تسجيل الدخول
      MESSAGE_TEXTS:
        DESCRIPTION: تخصيص نصوص رسائل البريد الإلكتروني أو الرسائل القصيرة للإشعار. إذا كنت تريد تعطيل بعض اللغات، اسحبها إلى قسم اللغات غير المسموح بها في إعدادات لغة المثيل.
        TITLE: نصوص الرسائل
        TYPE_DESCRIPTIONS:
          DC: عندما تطالب بنطاق لمنظمتك، سيتم مطالبة المستخدمين الذين لا يستخدمون هذا النطاق في اسم تسجيل الدخول بتغيير اسم تسجيل الدخول الخاص بهم ليتناسب مع النطاق المطالب به.
          INIT: عند إنشاء مستخدم، سيتلقى بريداً إلكترونياً برابط لتعيين كلمة المرور الخاصة به.
          IU: عندما يتم إنشاء رمز دعوة المستخدم، سيتلقى بريداً إلكترونياً برابط لتعيين طريقة المصادقة الخاصة به.
          PC: عندما يغير المستخدم كلمة المرور الخاصة به، سيتلقى إشعاراً بالتغيير إذا قمت بتمكين هذا في إعدادات الإشعارات.
          PL: عندما يضيف المستخدم طريقة مصادقة بدون كلمة مرور، يحتاج إلى تفعيلها بالنقر على رابط في البريد الإلكتروني.
          PR: عندما يعيد المستخدم تعيين كلمة المرور الخاصة به، سيتلقى بريداً إلكترونياً برابط لتعيين كلمة مرور جديدة.
          VE: عندما يغير المستخدم عنوان بريده الإلكتروني، سيتلقى بريداً إلكترونياً برابط للتحقق من العنوان الجديد.
          VEO: عندما يضيف المستخدم OTP عبر البريد الإلكتروني، يحتاج إلى تفعيلها بإدخال الرمز المرسل إلى بريده الإلكتروني.
          VP: عندما يغير المستخدم رقم هاتفه، سيتلقى رسالة نصية قصيرة برمز للتحقق من الرقم الجديد.
          VSO: عندما يضيف المستخدم OTP عبر الرسائل القصيرة، يحتاج إلى تفعيلها بإدخال الرمز المرسل إلى رقم هاتفه.
      OIDC:
        ACCESS_TOKEN:
          DESCRIPTION: يستخدم رمز الوصول لمصادقة المستخدم. هو رمز قصير العمر يستخدم للوصول إلى بيانات المستخدم. استخدم عمراً قصيراً لتقليل مخاطر الوصول غير المصرح به. يمكن تحديث رموز الوصول تلقائياً باستخدام رمز التحديث.
          TITLE: رمز الوصول
        DESCRIPTION: تكوين عمر رموز OIDC. استخدم أعماراً أقصر لزيادة أمان المستخدمين، واستخدم أعماراً أطول لزيادة راحة المستخدمين.
        ID_TOKEN:
          DESCRIPTION: رمز ID هو رمز JSON Web Token (JWT) يحتوي على مطالبات حول المستخدم. يجب ألا يتجاوز عمر رمز ID عمر رمز الوصول.
          TITLE: رمز ID
        LABEL_DAYS: الحد الأقصى للعمر بالأيام
        LABEL_HOURS: الحد الأقصى للعمر بالساعات
        REFRESH_TOKEN:
          DESCRIPTION: يستخدم رمز التحديث للحصول على رمز وصول جديد. هو رمز طويل العمر يستخدم لتحديث رمز الوصول. يجب على المستخدم إعادة المصادقة يدوياً عند انتهاء صلاحية رمز التحديث.
          TITLE: رمز التحديث
        REFRESH_TOKEN_IDLE:
          DESCRIPTION: عمر رمز التحديث الخامل هو الحد الأقصى للوقت الذي يمكن أن يكون فيه رمز التحديث غير مستخدم.
          TITLE: رمز التحديث الخامل
        TITLE: إعدادات OpenID Connect
      ORG:
        DESCRIPTION: تخصيص إعدادات المنظمة الخاصة بك.
        TITLE: إعدادات المنظمة
      PRIVACY_POLICY:
        DESCRIPTION: توجيه المستخدمين إلى موارد خارجية مخصصة تظهر في صفحة تسجيل الدخول. يحتاج المستخدمون إلى قبول شروط الخدمة وسياسة الخصوصية قبل أن يتمكنوا من التسجيل. غيّر الرابط إلى وثائقك أو عيّن سلسلة فارغة لإخفاء زر التوثيق من وحدة التحكم. أضف رابطاً خارجياً مخصصاً ونصاً مخصصاً لهذا الرابط في وحدة التحكم، أو اجعلهما فارغين لإخفاء هذا الزر.
        TITLE: روابط خارجية
      PW_COMPLEXITY:
        DESCRIPTION: تأكد من استخدام المستخدمين لكلمات مرور قوية من خلال تحديد قواعد التعقيد.
        TITLE: تعقيد كلمة المرور
      SECRET_GENERATORS:
        DESCRIPTION: حدد تعقيدات الأسرار وأعمارها. تعقيد وعمر أعلى يحسن الأمان، وتعقيد وعمر أقل يحسن أداء فك التشفير.
        TITLE: مولدات الأسرار
      SECURITY:
        DESCRIPTION: تمكين ميزات ZITADEL التي يمكن أن يكون لها تأثيرات أمنية. يجب أن تعرف حقاً ما تفعله قبل تغيير هذه الإعدادات.
        TITLE: إعدادات الأمان
      SMS_PROVIDER:
        DESCRIPTION: لفتح جميع ميزات ZITADEL، قم بتكوين Twilio لإرسال رسائل SMS للمستخدمين.
        TITLE: إعدادات الرسائل القصيرة (SMS)
      SMTP_PROVIDER:
        DESCRIPTION: تكوين خادم SMTP الخاص بك لاستخدام نطاق لعنوان المرسل يعرفه المستخدمون ويثقون به.
        TITLE: إعدادات SMTP
      WEB_KEYS:
        CREATE:
          BITS: بت
          CURVE: منحنى
          DESCRIPTION: إضافة مفتاح ويب جديد إلى القائمة. يستخدم ZITADEL مفاتيح RSA2048 مع تجزئة SHA256 افتراضياً.
          HASHER: تجزئة
          KEY_TYPE: نوع المفتاح
          TITLE: إنشاء مفتاح ويب جديد
        DESCRIPTION: إدارة مفاتيح الويب OIDC الخاصة بك لتوقيع الرموز والتحقق منها بأمان لمثيل ZITADEL الخاص بك.
        PREVIOUS_TABLE:
          DEACTIVATED_ON: تم التعطيل في
          DESCRIPTION: مفاتيح الويب السابقة التي لم تعد نشطة.
          TITLE: مفاتيح الويب السابقة
        TABLE:
          ACTIVATE: تفعيل مفتاح الويب التالي
          ACTIVE: نشط حالياً
          DESCRIPTION: مفاتيح الويب النشطة والقادمة. سيؤدي تفعيل مفتاح جديد إلى إلغاء تنشيط المفتاح الحالي.
          FUTURE: المستقبل
          NEXT: التالي في قائمة الانتظار
          NOTE: 'ملاحظة: نقطة نهاية JWKs OIDC تعيد استجابة قابلة للتخزين المؤقت (افتراضياً 5 دقائق). تجنب تفعيل مفتاح قريباً جداً، حيث قد لا يكون متاحاً للتخزين المؤقت والتطبيقات بعد.'
          TITLE: مفاتيح الويب النشطة والمستقبلية
          WARNING: مفتاح الويب عمره أقل من 5 دقائق
    USERS:
      DESCRIPTION: المستخدم هو إنسان أو حساب خدمة يمكنه الوصول إلى تطبيقاتك.
