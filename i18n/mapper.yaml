# Locale mapper: routes (catalog I/O) and optional aliases (DRY).
#
# Route entry:  match + path + format [+ locale_pointer]
# Alias entry:  unified + mapsTo
# Most specific match wins. File keys are the suffix after the route match prefix.

# --- routes ---
- format: yaml
  match: common
  path: internal/static/i18n/{locale}.yaml
- format: yaml
  match: login_v1
  path: internal/api/ui/login/static/i18n/{locale}.yaml
- format: yaml
  match: notification
  path: internal/notification/static/i18n/{locale}.yaml
- format: json
  match: console
  path: console/src/assets/i18n/{locale}.json
- format: json
  match: login_v2
  path: apps/login/locales/{locale}.json
- format: json
  locale_pointer: /{locale}
  match: login_v2_default
  path: internal/query/v2-default.json
# --- aliases (optional DRY) ---
# From en/sv runtime dups + check-duplicates cross-locale groups (score >= 1; fo ignored).
